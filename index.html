/* ---------- load / store ---------- */
async function loadMarket(){
  const M = S.market; if(M.loading) return; M.loading = true; M.error = null;
  try{
    if(!S.dbNS) throw {code:'no-db'};
    const snap = await S.dbNS.collection('market').limit(200).get();
    const docs = (snap && snap.docs) ? snap.docs.filter(d=>d.exists!==false) : [];
    const byId = {}; docs.forEach(d=>{ byId[d.id] = typeof d.data==='function' ? d.data() : d.data; });
    const meta = byId.meta || null;
    let rows = [];
    if(meta){
      const fields = meta.fields || SC_FIELDS;
      Object.keys(byId).filter(k=>k.startsWith('c')).sort().forEach(k=>{
        try{ JSON.parse(byId[k].data||'[]').forEach(a=>{ const o={}; fields.forEach((f,i)=>o[f]=a[i]); rows.push(o); }); }catch(e){ console.warn('bad chunk', k); }
      });
    }
    M.meta = meta; M.rows = rows.map(scPrep); M.loaded = true;
    try{
      const ws = await S.dbNS.collection('watch').limit(1000).get();
      S.watch = {}; (ws && ws.docs || []).filter(d=>d.exists!==false).forEach(d=>{ const b = typeof d.data==='function'?d.data():d.data; S.watch[d.id] = JSON.parse(JSON.stringify(b)); });
    }catch(e){ console.warn('watch read failed', e); }
  }catch(e){ M.error = (e && (e.code||e.message)) || 'error'; M.loaded = true; }
  M.loading = false; S.scCache = null;
}

async function importFeed(feed){
  if(!feed || !Array.isArray(feed.rows) || !Array.isArray(feed.fields)) throw new Error('This file is not a Gem Rock feed (missing fields/rows).');
  const idx = SC_FIELDS.map(f=>feed.fields.indexOf(f));
  if(idx[0]<0 || idx[1]<0) throw new Error('The feed is missing listing ids or titles.');
  const rows = feed.rows.map(r=>idx.map(i=>i<0?null:r[i]));
  if(!S.dbNS || !S.ready) throw new Error('Storage is not available in this view.');
  const chunks = []; let cur = [], size = 2;
  rows.forEach(r=>{ const s = JSON.stringify(r).length+1; if(size+s > 190000 && cur.length){ chunks.push(cur); cur=[]; size=2; } cur.push(r); size+=s; });
  if(cur.length) chunks.push(cur);
  const col = S.dbNS.collection('market');
  const old = await col.limit(200).get();
  for(let i=0;i<chunks.length;i++) await col.doc('c'+String(i).padStart(2,'0')).set({data: JSON.stringify(chunks[i]), n: chunks[i].length});
  for(const d of (old.docs||[])){ if(d.id.startsWith('c') && Number(d.id.slice(1))>=chunks.length) await col.doc(d.id).delete(); }
  await col.doc('meta').set({fields:SC_FIELDS, count:rows.length, chunks:chunks.length, scannedAt: feed.scannedAt || null, importedAt: new Date().toISOString(), source: feed.source || 'gemrockauctions.com', categories: feed.categories || null, pages: feed.pages || null});
  S.market.loaded = false; await loadMarket();
}

/* ---------- per-listing interpretation (does not depend on settings) ---------- */
function scSpecies(r){
  const c0 = (r.c0||'').toLowerCase(), title = (r.t||'').toLowerCase();
  const tt = title.replace(/emerald[- ](cut|shape|step)/g,'').replace(/ruby[- ]?zoisite/g,'zoisite');
  const all = tt+' '+c0+' '+(r.c1||'').toLowerCase();
  if(/lab[- ]?(created|grown)|synthetic|simulant|simulated|\bcreated\b|hydrothermal|\bcz\b|cubic zirconia|moissanite|nanosital|\bglass\b(?![- ]filled)|imitation|\bfaux\b/.test(tt)) return {key:null, why:'Synthetic / simulant (from the title)', synthetic:true};
  const has = (re)=>re.test(all);
  if(/opal/.test(c0) || /\bopal/.test(tt)){
    if(/doublet|triplet/.test(tt)) return {key:null, why:'Assembled opal (doublet / triplet) — not modelled'};
    if(/mexic|fire opal|peruvian|pink opal|blue opal|dendrit|common opal/.test(tt)) return {key:null, why:'Opal type not covered by the model'};
    if(/austral|lightning ridge|coober|boulder|black opal|queensland|andamooka|mintabie|yowah|koroit/.test(tt)) return {key:'opal-australian'};
    if(/ethiop|welo|wollo/.test(tt)) return {key:'opal-ethiopian'};
    return {key:'opal-ethiopian', note:'Opal origin not stated — valued with the (lower) Ethiopian band'};
  }
  if(c0==='ruby' || (/\bruby\b/.test(tt) && !/sapphire/.test(c0))) return {key:'ruby'};
  if(c0==='sapphire' || /sapphire/.test(tt)){
    if(/padparad/.test(all)) return {key:'sapphire-padparadscha'};
    if(/white|colou?rless/.test(all)) return {key:'sapphire-white'};
    if(/pink|purple|violet|lavender|magenta/.test(all)) return {key:'sapphire-pink'};
    if(/yellow|orange|gr+e+n|teal|peach|golden|parti|bio?-?colou?r/.test(all)) return {key:'sapphire-yellow'};
    return {key:'sapphire-blue'};
  }
  if(c0==='emerald' || /\bemerald\b/.test(tt)) return {key:'emerald'};
  if(c0==='tanzanite' || /tanzanite/.test(tt)) return {key:'tanzanite'};
  if(c0==='spinel' || /spinel/.test(tt)){
    if(/cobalt/.test(tt)) return {key:null, why:'Cobalt spinel — not covered by the model'};
    return {key: /\bred\b|hot pink|\bpink\b|jedi|crimson/.test(tt) ? 'spinel-red' : 'spinel-other'};
  }
  if(/alexandrite/.test(all)) return {key:'alexandrite'};
  if(c0==='chrysoberyl') return {key:null, why:'Chrysoberyl (non-alexandrite) — not modelled'};
  if(c0==='garnet' || /garnet|tsavorite|tsavolite|rhodolite|almandine|hessonite|spessart|demantoid/.test(tt)){
    if(/tsavorite|tsavolite/.test(tt)) return {key:'tsavorite'};
    if(/demantoid|mandarin|spessart|colou?r[- ]?change|mali/.test(tt)) return {key:null, why:'Garnet variety not covered by the model'};
    return {key:'garnet'};
  }
  if(c0==='tourmaline' || /tourmaline|rubellite|indicolite/.test(tt)){
    if(/paraiba|para[ií]ba|cuprian/.test(tt)) return {key:null, why:'Paraíba (cuprian) tourmaline — not modelled'};
    return {key:'tourmaline'};
  }
  if(c0==='aquamarine' || /aquamarine/.test(tt)) return {key:'aquamarine'};
  if(c0==='morganite' || /morganite/.test(tt)) return {key:'morganite'};
  if(c0==='peridot' || /peridot/.test(tt)) return {key:'peridot'};
  if(c0==='zircon' || /zircon/.test(tt)) return {key:'zircon'};
  if(c0==='sphene' || /sphene|titanite/.test(tt)) return {key:'sphene'};
  if(c0==='sphalerite' || /sphalerite/.test(tt)) return {key:'sphalerite'};
  if(c0==='topaz' || /topaz/.test(tt)){
    if(/mystic|coat|rainbow|titanium/.test(tt)) return {key:'topaz-coated'};
    if(/imperial|precious|sherry|peach|\bpink\b|natural colou?r/.test(tt) && !/irradiat/.test((r.tr||'').toLowerCase())) return {key:'topaz-imperial'};
    return {key:'topaz-blue'};
  }
  if(c0==='turquoise' || /turquoise/.test(tt)) return {key:'turquoise'};
  if(/amethyst/.test(all)) return {key:'amethyst'};
  if(/citrine/.test(all)) return {key:'citrine'};
  return {key:null, why:'Gem type not covered by the model'};
}
function scTreatClaim(r){
  const tx = ((r.tr||'')+' | '+(r.t||'')).toLowerCase();
  if(/doublet|triplet/.test(tx)) return 'assembled';
  if(/glass[- ]?filled|lead[- ]?glass|composite|fracture[- ]?fill|\bfilled\b/.test(tx)) return 'filled';
  if(/diffus|beryllium/.test(tx)) return 'diffused';
  if(/coated|coating|mystic/.test(tx)) return 'coated';
  if(/\bdyed?\b|smoked|stabili[sz]ed|resin/.test(tx)) return 'dyed';
  if(/no indication of treatment|unheated|no[- ]heat|non[- ]?heat|not heated|untreated|no treatment|no oil|natural colou?r and clarity/.test(tx)) return 'none';
  if(/irradiat/.test(tx)) return 'irradiated';
  if(/\boil|clarity enhanced|minor enhancement|insignificant/.test(tx)) return 'oil';
  if(/heat/.test(tx)) return 'heated';
  return 'unknown';
}
function scCert(r){
  const tx = (r.t||'').toLowerCase();
  if(/\b(gia|grs|ssef|g[uü]belin|agl|lotus|gubelin)\b/.test(tx)) return 'major';
  if(r.ce || /\b(igi|gci|aigs|igl|git|gra|igc|gil|ags|agi|gemolog|certificate|certified|lab report|cert)\b/.test(tx)) return 'minor';
  return 'auction';
}
function scForm(r, key){
  const tx = (r.t||'').toLowerCase(), cu = (r.cu||'').toLowerCase();
  if(/specimen|on matrix|crystal cluster|\bcluster\b/.test(tx) || (/\bcrystals?\b/.test(tx) && !/opal/.test(key||''))) return 'specimen';
  if(/\brough\b|\braw\b|uncut|facet grade rough/.test(tx) || /rough/.test(cu)) return 'rough';
  if(/cabochon|carved/.test(cu) || /cabochon|\bcab\b|\bstar\b|cat'?s? ?eye|carving|carved|bead/.test(tx)) return 'cabochon';
  if(!cu && key && /opal|turquoise/.test(key)) return 'cabochon';
  return 'faceted';
}
function scClarity(r, key){
  const cl = (r.cl||'').toLowerCase(), tx=(r.t||'').toLowerCase();
  if(/opal/.test(key||'')) return 'clean';
  if(/semi[- ]?transparent|translucent|opaque|milky|cloudy/.test(tx)) return 'heavy';
  if(/^(fl|if|vvs|vs|eye ?clean|loupe)/.test(cl)) return 'clean';
  if(/^si/.test(cl)) return 'slight';
  if(/^i(\d|$)|included/.test(cl)) return 'included';
  if(/opaque|translucent/.test(cl)) return 'heavy';
  if(/semi[- ]?transparent|translucent|opaque|milky|cloudy|\bsilky\b/.test(tx)) return 'heavy';
  if(/eye[- ]?clean|loupe[- ]?clean|\bvvs|\bvs\b|\bif\b/.test(tx)) return 'clean';
  if(key==='turquoise') return 'clean';
  return 'slight';
}
function scPieces(r){
  const tx = (r.t||'').toLowerCase();
  const m = tx.match(/\b(\d{1,3})\s*(pcs|pc|pieces|piece|stones|psc)\b/) || tx.match(/\blot of (\d{1,3})\b/);
  if(m && Number(m[1])>1) return {n:Number(m[1]), kind: Number(m[1])===2 ? 'pair' : 'lot'};
  if(/\bpairs?\b|matched|\bmatching\b/.test(tx) || /matched pair/i.test(r.cu||'')) return {n:2, kind:'pair'};
  if(/\blot\b|parcel|mixed|assorted/.test(tx)) return {n:null, kind:'lot'};
  return {n:1, kind:'single'};
}
function scTitleTier(r){
  const m = (r.t||'').toUpperCase().match(/(?:^|[^A-Z])(A{1,4})\+?(?=[^A-Z]|$)/);
  return m ? m[1] : null;
}
function scOriginName(r){
  const tx = (r.t||'').toLowerCase();
  for(const [name,re] of SC_ORIGINS) if(re.test(tx)) return name;
  return null;
}
function scPrep(r){
  if(/no reserve/i.test(r.c0||'')) r = {...r, c0: (r.c1||'').replace(/\s*auctions?$/i,'')};
  const sp = scSpecies(r);
  const pieces = scPieces(r);
  const x = {...r, key: sp.key, why: sp.why||null, spNote: sp.note||null, synthetic: !!sp.synthetic,
    form: scForm(r, sp.key), clarityKey: scClarity(r, sp.key), claim: scTreatClaim(r), certKey: scCert(r),
    pieces: pieces.n, lotKind: pieces.kind, titleTier: scTitleTier(r), originName: scOriginName(r),
    mm: Math.max(Number(r.l)||0, Number(r.w)||0), colours: (r.co||'').split(',').filter(Boolean),
    shapeN: (r.sh||'').trim() || null, titleL: (r.t||'').toLowerCase(),
    lowGrade: /low[- ]?grade|commercial[- ]?grade|\bcommercial\b|lower grade|\bb grade\b|\bgrade b\b|\bpale\b|very light|light (green|pink|blue|colou?r)|semi[- ]?transparent|opaque|milky|rutile|\bsilky\b|included|cracked|\bchipped\b/.test((r.t||'').toLowerCase())};
  x.price = x.ty==='A' ? (Number(r.cb)>0 ? Number(r.cb) : Number(r.p)||0) : Number(r.p)||0;
  if(!(Number(r.ct)>0)) { x.key = null; x.why = x.why || 'No carat weight on the listing'; }
  if(x.key && ['morganite','aquamarine','tourmaline','zircon','tanzanite','topaz-imperial','spinel-other'].includes(x.key) && /\bwhite\b|colou?rless/.test(x.titleL)) x.lowGrade = true;
  if(x.lotKind==='lot' && !x.pieces){ x.key = null; x.why = x.why || 'Lot / parcel without a piece count — cannot value per stone'; }
  if(x.claim==='assembled' && x.key && !/opal/.test(x.key)){ x.key = null; x.why = 'Assembled stone (doublet / triplet)'; }
  return x;
}

/* ---------- valuation for current settings ---------- */
function scTreatmentId(x, cfg){
  const fam = MM_SPECIES[x.key].family, c = x.claim;
  const hasLab = x.certKey==='major' || (x.certKey==='minor' && cfg.credit==='lab-any');
  const creditNone = cfg.credit==='always' || ((cfg.credit==='lab' || cfg.credit==='lab-any') && hasLab);
  const heatStd = ['aquamarine','morganite','zircon','tourmaline','tanzanite'].includes(x.key);
  const map = {
    corundum: {none: creditNone?'unheated':'heated', heated:'heated', oil:'heated', irradiated:'unknown', filled:'filled', diffused:'diffused', coated:'diffused', dyed:'filled', unknown:'unknown'},
    emerald:  {none: creditNone?'none':'minor', heated:'minor', oil:'minor', irradiated:'unknown', filled:'resin', diffused:'resin', coated:'resin', dyed:'resin', unknown:'unknown'},
    tanzanite:{none: creditNone?'unheated':'heated', heated:'heated', oil:'heated', irradiated:'unknown', filled:'coated', diffused:'coated', coated:'coated', dyed:'coated', unknown:'heated'},
    spinel:   {none:'none', heated:'heated', oil:'unknown', irradiated:'unknown', filled:'heated', diffused:'heated', coated:'heated', dyed:'heated', unknown:'unknown'},
    topaz:    {none:'standard', heated:'standard', oil:'standard', irradiated:'standard', filled:'unknown', diffused:'unknown', coated:'standard', dyed:'unknown', unknown:'unknown'},
    quartz:   {none:'standard', heated:'standard', oil:'standard', irradiated:'standard', filled:'unknown', diffused:'unknown', coated:'unknown', dyed:'unknown', unknown:'unknown'},
    opal:     {none:'none', heated:'unknown', oil:'unknown', irradiated:'unknown', filled:'stabilised', diffused:'unknown', coated:'stabilised', dyed:'smoked', unknown:'unknown', assembled:'stabilised'},
    other:    {none:'none', heated: heatStd?'none':'treated', oil:'treated', irradiated:'treated', filled:'filled', diffused:'treated', coated:'filled', dyed:'filled', unknown:'unknown'},
  };
  const fm = map[fam] || map.other;
  let id = fm[c] || fm.unknown;
  if(x.key==='topaz-coated') id='standard';
  return {id, credited: c==='none' && creditNone, uncreditedClaim: c==='none' && !creditNone && ['corundum','emerald','tanzanite'].includes(fam)};
}
function scTier(x, cfg){
  if(x.lowGrade){ return {tier:'A', basis:'title describes a low / commercial grade'}; }
  if(SC_TIERS.includes(cfg.tier)) return {tier:cfg.tier, basis:'assumed'};
  const claim = x.titleTier;
  if(!claim) return {tier:'AA', basis:'no grade in title — AA assumed'};
  if(cfg.tier==='claim') return {tier:claim, basis:'seller\'s grade'};
  const i = Math.max(0, SC_TIERS.indexOf(claim)-1);
  return {tier:SC_TIERS[i], basis:`seller's ${claim} less one step`};
}
function scValue(x, cfg){
  if(!x.key || !MM_SPECIES[x.key]) return null;
  const pieces = x.pieces || 1;
  const {inp, t, trt, originUncredited} = scModelInput(x, cfg);
  const m = marketModel(inp);
  if(m.error) return null;
  const prem = (Number(cfg.premium)||0)/100, ship = Number(cfg.ship)||0, target=(Number(cfg.target)||0)/100;
  const k = pieces;
  const v = {tier:t.tier, tierBasis:t.basis, treatment:mmPick(mmTreatmentList(x.key), trt.id).label, credited:trt.credited, uncredited:trt.uncreditedClaim, originUncredited,
    wsLow:m.wsLow*k, wsMid:m.wsMid*k, wsHigh:m.wsHigh*k, retail:m.retail*k, retailLow:m.retailLow*k, retailHigh:m.retailHigh*k, confidence:m.confidence, perCt:m.wsMidCt};
  v.landed = Math.round(x.price*(1+prem) + ship);
  v.margin = v.wsMid - v.landed;
  v.marginPct = v.wsMid>0 ? v.margin/v.wsMid : null;
  v.retailUpside = v.retail - v.landed;
  v.maxBid = Math.max(0, Math.floor((v.wsMid*(1-target) - ship)/(1+prem)));
  v.verdict = mmVerdict({wsLow:v.wsLow, wsMid:v.wsMid, wsHigh:v.wsHigh, retailLow:v.retailLow}, v.landed);
  v.isAuction = x.ty==='A';
  // an auction's current bid is not its final price: no "too cheap" test, and the score is discounted
  v.suspicious = !v.isAuction && v.landed < v.wsLow*0.35;
  v.deep = !v.isAuction && !v.suspicious && v.landed < v.wsLow*0.6;
  v.heavyTrt = ['filled','diffused','coated','dyed','assembled'].includes(x.claim);
  v.headroom = v.maxBid - x.price;
  let s = v.marginPct==null ? -9 : v.marginPct;
  if(v.isAuction) s = Math.min(s, 0.75) * 0.6;
  if(v.suspicious) s -= 1.5;
  if(v.deep) s -= 0.2;
  if(v.heavyTrt) s -= 0.3;
  if(v.confidence==='Low') s -= 0.05;
  v.score = s;
  return v;
}
function scModelInput(x, cfg){
  const pieces = x.pieces || 1;
  const t = scTier(x, cfg), trt = scTreatmentId(x, cfg);
  const pseudo = {mmSpecies:x.key, mmForm:x.form, mmTreatment:trt.id, mmClarity:x.clarityKey, mmCut:'good', mmCert:x.certKey,
    origin: x.t, qualityGrade:t.tier, caratActual: Number(x.ct)/pieces};
  let inp = itemModelInput(pseudo), originUncredited = false;
  const org = mmPick(mmOriginList(x.key), inp.origin);
  const hasLab = x.certKey==='major' || (x.certKey==='minor' && cfg.credit==='lab-any');
  const credit = cfg.credit==='always' || ((cfg.credit==='lab' || cfg.credit==='lab-any') && hasLab);
  if(org.mult>1 && !credit){ inp = {...inp, origin:'std'}; originUncredited = true; }
  return {inp, t, trt, originUncredited};
}
function scCfgKey(c){ return [c.tier,c.credit,c.premium,c.ship,c.target].join('|'); }
function scValued(){
  const c = scState(), key = scCfgKey(c);
  if(S.scCache && S.scCache.key===key && S.scCache.n===S.market.rows.length) return S.scCache.list;
  const list = S.market.rows.map(x=>({x, v: scValue(x, c)}));
  S.scCache = {key, n:S.market.rows.length, list};
  return list;
}

/* ---------- filtering ---------- */
function scFilter(list){
  const c = scState(); const now = Date.now()/1000;
  const q = c.q.trim().toLowerCase(); const qs = q ? q.split(/\s+/) : [];
  const num = (s)=> s===''||s==null ? null : Number(s);
  const pmin=num(c.pmin), pmax=num(c.pmax), ctmin=num(c.ctmin), ctmax=num(c.ctmax), mmmin=num(c.mmmin), mmmax=num(c.mmmax), minM=num(c.minMargin), endsH=num(c.endsH);
  return list.filter(({x,v})=>{
    if(c.watchOnly && !S.watch['GR-'+x.id]) return false;
    if(!v && !c.showUnmodeled) return false;
    if(v && c.hideRisk && (v.suspicious || v.heavyTrt)) return false;
    if(c.species!=='all' && x.key!==c.species) return false;
    if(c.ltype!=='all' && x.ty!==c.ltype) return false;
    if(pmin!=null && x.price<pmin) return false;
    if(pmax!=null && x.price>pmax) return false;
    const perCt = Number(x.ct)/(x.pieces||1);
    if(ctmin!=null && perCt<ctmin) return false;
    if(ctmax!=null && perCt>ctmax) return false;
    if(mmmin!=null && !(x.mm>=mmmin)) return false;
    if(mmmax!=null && !(x.mm>0 && x.mm<=mmmax)) return false;
    if(minM!=null && !(v && v.marginPct!=null && v.marginPct*100>=minM)) return false;
    if(c.treat==='none' && x.claim!=='none') return false;
    if(c.treat==='heated' && x.claim!=='heated') return false;
    if(c.treat==='noheavy' && ['filled','diffused','coated','dyed','assembled'].includes(x.claim)) return false;
    if(c.cert==='lab' && x.certKey==='auction') return false;
    if(c.cert==='major' && x.certKey!=='major') return false;
    if(c.origin!=='any' && x.originName!==c.origin) return false;
    if(c.shape!=='any' && x.shapeN!==c.shape) return false;
    if(c.form!=='any' && x.form!==c.form) return false;
    if(c.clarity!=='any' && x.clarityKey!==c.clarity) return false;
    if(c.colour!=='any' && !x.colours.includes(c.colour)) return false;
    if(endsH!=null && !(x.ty==='A' && x.e && x.e>now && x.e-now<=endsH*3600)) return false;
    if(c.video && !x.vi) return false;
    if(c.nr && !x.nr) return false;
    if(c.lots==='single' && x.lotKind!=='single') return false;
    if(c.lots==='pairs' && x.lotKind!=='pair') return false;
    if(c.lots==='nolots' && x.lotKind==='lot') return false;
    if(qs.length && !qs.every(w=>x.titleL.includes(w) || (x.s||'').toLowerCase().includes(w))) return false;
    if(x.ty==='A' && x.e && x.e < now) return false;
    return true;
  });
}
function scSort(arr){
  const c = scState(); const now=Date.now()/1000;
  const by = {
    score: (a,b)=> (b.v?b.v.score:-99)-(a.v?a.v.score:-99),
    marginUsd: (a,b)=> (b.v?b.v.margin:-1e9)-(a.v?a.v.margin:-1e9),
    upside: (a,b)=> (b.v?b.v.retailUpside:-1e9)-(a.v?a.v.retailUpside:-1e9),
    ending: (a,b)=> ((a.x.ty==='A'&&a.x.e>now)?a.x.e:9e12)-((b.x.ty==='A'&&b.x.e>now)?b.x.e:9e12),
    priceAsc: (a,b)=> a.x.price-b.x.price,
    priceDesc: (a,b)=> b.x.price-a.x.price,
    carat: (a,b)=> Number(b.x.ct)-Number(a.x.ct),
    newest: (a,b)=> (b.x.cr||0)-(a.x.cr||0),
  };
  return arr.sort(by[c.sort]||by.score);
}

/* ---------- formatting helpers ---------- */
function scEnds(x){
  if(x.ty!=='A') return x.mo ? 'Buy now · offers accepted' : 'Buy now';
  if(!x.e) return 'Auction';
  const s = x.e - Date.now()/1000; if(s<=0) return 'Auction ended';
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  return `Auction · ${d?d+'d ':''}${d<2?h+'h ':''}${!d&&h<3?m+'m':''}left`.replace(/ +left/,' left');
}

  const limit = S.scLimit || 100;

    <div class="stat-card"><div class="label">Top-ranked candidate</div><div class="value num">${best&&best.v?pct(best.v.marginPct):'—'}</div><div class="sub">${best&&best.v?escapeHtml(scSpLabel(best.x.key)):''}</div></div>

    <div class="tbl-wrap" style="box-shadow:none;"><table class="sc-sp"><thead><tr><th>Gem type</th><th>Listings</th><th>Below wholesale mid</th><th>Median price ÷ wholesale mid</th><th>Best candidate</th><th>Margin</th></tr></thead><tbody>
    ${spRows.map(s=>`<tr data-scsp="${s.k}" style="cursor:pointer;"><td><strong>${escapeHtml(scSpLabel(s.k))}</strong></td><td class="num">${s.n}</td><td class="num">${s.pos}</td><td class="num">${s.med?Math.round(s.med*100)+'%':'—'}</td><td><div class="row-sub" style="max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(s.top.x.t)}</div></td><td class="num ${tone(s.top.v.marginPct)}">${pct(s.top.v.marginPct)}</td></tr>`).join('')}
    </tbody></table></div></div>`:''}

  <div class="toolbar" style="justify-content:space-between;">
    <div style="font-size:13px;color:var(--ink-soft);">Showing ${Math.min(limit,res.length).toLocaleString()} of ${res.length.toLocaleString()}</div>
    <div style="display:flex;gap:8px;align-items:center;"><span style="font-size:12px;color:var(--ink-faint);">Sort</span>
      <select id="sc_sort" class="grade-sel" style="padding:6px 10px;">${scOpts([['score','Best buy (risk-adjusted margin)'],['marginUsd','Largest $ margin'],['upside','Largest retail upside'],['ending','Auctions ending soonest'],['priceAsc','Price: low to high'],['priceDesc','Price: high to low'],['carat','Carat: largest'],['newest','Newest listings']], c.sort)}</select></div>
  </div>
  ${res.length ? `<div class="tbl-wrap"><table class="sc-tbl"><thead><tr>
    <th>Stone</th><th>Listing</th><th>Price → landed</th><th>Wholesale low–mid</th><th>Suggested retail</th><th>Margin vs WS mid</th><th>Max bid @${escapeHtml(String(Number(c.target)||0))}%</th><th>Verdict</th><th></th></tr></thead><tbody>
    ${res.slice(0,limit).map(({x,v})=>{
      const flags = [];
      if(v&&v.suspicious) flags.push('<span class="flag bad">Suspiciously cheap</span>');
      if(v&&v.deep) flags.push('<span class="flag" title="Far below the model\'s low wholesale — check the photos, grade and seller carefully">deep discount — verify</span>');
      if(x.lowGrade) flags.push('<span class="flag" title="The title signals a lower grade, so the stone is valued at A">low-grade wording</span>');
      if(v&&v.heavyTrt) flags.push('<span class="flag bad">'+escapeHtml(x.claim)+'</span>');
      if(v&&v.uncredited) flags.push('<span class="flag" title="Unheated / untreated claim without a qualifying lab report — valued as standard">claim not credited</span>');
      if(v&&v.credited) flags.push('<span class="flag ok">no-treatment credited</span>');
      if(v&&v.originUncredited) flags.push('<span class="flag" title="Premium origin named in the title but no qualifying lab report — valued at the baseline origin">origin premium not credited</span>');
      if(x.lotKind==='pair') flags.push('<span class="flag">pair</span>'); else if(x.lotKind==='lot') flags.push(`<span class="flag">${x.pieces||'?'} pcs</span>`);
      if(x.certKey!=='auction') flags.push(`<span class="flag ok">${x.certKey==='major'?'major lab':'lab report'}</span>`);
      if(x.spNote) flags.push(`<span class="flag" title="${escapeHtml(x.spNote)}">origin assumed</span>`);
      if(!v) flags.push(`<span class="flag">${escapeHtml(x.why||'not modelled')}</span>`);
      const watched = !!S.watch['GR-'+x.id];
      return `<tr>
      <td style="max-width:360px;"><a class="row-title sc-title" href="${scLink(x)}" target="_blank" rel="noopener">${escapeHtml(x.t)}</a>
        <div class="row-sub">${escapeHtml(x.key?scSpLabel(x.key):(x.c0||''))} · ${fmtNum(x.ct)} ct${x.pieces>1?` (${x.pieces} × ${fmtNum(Number(x.ct)/x.pieces)} ct)`:''}${x.mm?` · ${fmtNum(x.l,1)}×${fmtNum(x.w,1)} mm`:''} · ${escapeHtml(x.form)}${x.shapeN?' · '+escapeHtml(x.shapeN):''}${x.originName?' · '+escapeHtml(x.originName):''}</div>
        <div class="row-sub">${v?`Valued at ${escapeHtml(v.tier)} (${escapeHtml(v.tierBasis)}) · ${escapeHtml(v.treatment)}`:''}</div>
        <div class="sc-flags">${flags.join('')}</div></td>
      <td style="white-space:nowrap;"><div>${escapeHtml(scEnds(x))}</div><div class="row-sub">${x.ty==='A'?`${x.nb||0} bid${x.nb===1?'':'s'}${x.nr?' · no reserve':''}`:''}${x.vi?(x.ty==='A'?' · ':'')+'video':''}</div><div class="row-sub">${escapeHtml(x.s||'')}${x.sc?' · '+escapeHtml(x.sc):''}</div></td>
      <td class="num" style="white-space:nowrap;"><div>${fmtUSD(x.price)}${x.ty==='A'?'<span class="row-sub"> now</span>':''}</div><div class="row-sub">${v?'landed '+fmtUSD(v.landed):''}</div></td>
      <td class="num" style="white-space:nowrap;">${v?fmtUSD(v.wsLow)+'–'+fmtUSD(v.wsMid):'—'}</td>
      <td class="num">${v?fmtUSD(v.retail):'—'}</td>
      <td class="num ${v?tone(v.marginPct):''}" style="white-space:nowrap;"><div><strong>${v?pct(v.marginPct):'—'}</strong></div><div class="row-sub">${v?(v.margin>=0?'+':'−')+fmtUSD(Math.abs(v.margin)):''}${v&&v.isAuction?' at current bid':''}</div></td>
      <td class="num">${v?(v.maxBid>0?fmtUSD(v.maxBid):'<span class="row-sub">none</span>'):'—'}</td>
      <td>${v&&v.isAuction ? (v.headroom>0?`<span class="badge badge-certified" title="Current bid is below your max bid">Bid up to ${fmtUSD(v.maxBid)}</span>`:`<span class="badge badge-unknown">Above your max bid</span>`) : v&&v.verdict?`<span class="badge ${v.verdict.tone==='good'?'badge-certified':v.verdict.tone==='bad'?'badge-unknown':'badge-verified'}">${escapeHtml(v.verdict.label)}</span>`:'—'}</td>
      <td style="white-space:nowrap;"><a class="btn btn-sm" href="${scLink(x)}" target="_blank" rel="noopener">Open ↗</a>
        ${v?`<button class="btn btn-sm" data-sceval="${x.id}">Evaluate</button>`:''}
        <button class="btn btn-sm ${watched?'btn-primary':'btn-ghost'}" data-scwatch="${x.id}" title="${watched?'Remove from watchlist':'Add to watchlist'}">${watched?'★':'☆'}</button></td>
    </tr>`;}).join('')}
  </tbody></table></div>
  ${res.length>limit?`<div style="text-align:center;margin:14px 0;"><button class="btn" id="scMore">Show 100 more</button></div>`:''}` : `<div class="panel"><div class="empty-state" style="padding:30px 10px;">No listings match this screen. Loosen a filter (margin, size, grade) or clear the design preset.</div></div>`}`;
}

const SC_FEED_SCRIPT = `(async()=>{const F=${JSON.stringify(SC_FIELDS.slice(0,-1))};const plan=[['no-reserve-gemstone-online-auctions',90],['sapphire',20],['ruby',10],['emerald',10],['spinel',8],['tanzanite',8],['tourmaline',8],['opals',12],['garnet',6],['aquamarine',6],['zircon',5],['alexandrite',5],['peridot',4],['topaz',4],['amethyst',3],['citrine',3],['morganite',3],['sphene',3],['turquoise',2],['sphalerite',2],['chrysoberyl',3]];const rows={};let pages=0;const tx=document.createElement('textarea');const toS=x=>x==null?null:(typeof x==='number'?x:Math.round(Date.parse(x)/1000));function parse(t){const re=/auction:\\s*(\\{.*?\\}),\\s*\\n\\s*init\\(\\)/gs;const out=[];let m;while((m=re.exec(t))){tx.innerHTML=m[1];try{out.push(JSON.parse(tx.value))}catch(e){}}return out}function norm(o,q){const v={};(o.variants||[]).forEach(x=>Object.assign(v,x));const c=o.categories||{};return [o.id,o.title,o.type==='auction'?'A':'B',Number(o.price)||0,Number(o.cur_bid)||0,o.num_bids||0,toS(o.ends_at),Number(o.weight)||0,o.length||0,o.width||0,o.depth||0,o.seller,o.seller_country_id,c.lvl0||'',(c.lvl1||'').split(' > ').pop(),v['59']||'',v['63']||'',v['62']||'',v['60']||'',v['5']?1:0,(o.colours||[]).join(','),o.has_video?1:0,o.no_reserve?1:0,o.make_an_offer?1:0,o.store_favourite_ratio||null,o.discount_percent||null,o.reserve_met?1:0,o.created_at||null,q]}async function cat(s,max){for(let p=1;p<=max;p++){try{const t=await fetch('/auctions/'+s+(p>1?'?page='+p:'')).then(r=>r.text());const a=parse(t);pages++;let n=0;a.forEach(o=>{if(o.status==='open'&&!rows[o.id]){rows[o.id]=norm(o,s);n++}});console.log('[gem feed]',s,'page',p,'+'+n,'total',Object.keys(rows).length);if(!a.length||!n)break}catch(e){console.warn(s,p,e)}}}const q=plan.slice();await Promise.all([0,1,2,3].map(async()=>{while(q.length){const[s,m]=q.shift();await cat(s,m)}}));const feed={v:1,source:'gemrockauctions.com',scannedAt:new Date().toISOString(),pages,fields:F.concat(['q']),rows:Object.values(rows)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(feed)],{type:'application/json'}));a.download='gemrock_feed.json';document.body.appendChild(a);a.click();console.log('[gem feed] done —',feed.rows.length,'listings saved to gemrock_feed.json')})();`;

/* ---------- wiring ---------- */
function scRenderResults(){ const box=document.getElementById('scResults'); if(!box) return; box.innerHTML = scResultsHtml(); scWireResults(); }
function scWireResults(){
  const sort = document.getElementById('sc_sort'); if(sort) sort.onchange = ()=>{ scState().sort = sort.value; S.scLimit=100; scRenderResults(); };
  const more = document.getElementById('scMore'); if(more) more.onclick = ()=>{ S.scLimit = (S.scLimit||100)+100; scRenderResults(); };
  document.querySelectorAll('[data-scsp]').forEach(tr=> tr.onclick = ()=>{ scState().species = tr.getAttribute('data-scsp'); renderShell('screener'); window.scrollTo({top:0,behavior:'smooth'}); });
  document.querySelectorAll('#main [data-sceval]').forEach(b=> b.onclick = ()=> scToEvaluate(b.getAttribute('data-sceval')));
  document.querySelectorAll('#main [data-scwatch]').forEach(b=> b.onclick = ()=> scToggleWatch(b.getAttribute('data-scwatch')));
}
function wireScreener(){
  const c = scState();
  const rb = document.getElementById('scRefreshBtn'); if(rb) rb.onclick = ()=>{ const el=document.getElementById('scRefresh'); if(el) el.scrollIntoView({behavior:'smooth'}); };
  if(!document.getElementById('scResults')){ scWireRefresh(); return; }
  const textIds = ['q','minMargin','pmin','pmax','ctmin','ctmax','mmmin','mmmax','endsH','premium','ship','target'];
  const selIds = ['species','ltype','tier','form','shape','clarity','colour','treat','cert','origin','lots','credit'];
  const chkIds = ['hideRisk','video','nr','showUnmodeled','watchOnly'];
  let tmr = null;
  textIds.forEach(k=>{ const el=document.getElementById('sc_'+k); if(el) el.addEventListener('input', ()=>{ c[k]=el.value; if(['premium','ship','target'].includes(k)) S.scCache=null; S.scLimit=100; clearTimeout(tmr); tmr=setTimeout(scRenderResults, 220); }); });
  selIds.forEach(k=>{ const el=document.getElementById('sc_'+k); if(el) el.addEventListener('change', ()=>{ c[k]=el.value; if(['tier','credit'].includes(k)) S.scCache=null; S.scLimit=100; scRenderResults(); }); });
  chkIds.forEach(k=>{ const el=document.getElementById('sc_'+k); if(el) el.addEventListener('change', ()=>{ c[k]=el.checked; S.scLimit=100; scRenderResults(); }); });
  const adv = document.querySelector('.sc-adv'); if(adv) adv.addEventListener('toggle', ()=>{ S.scAdvOpen = adv.open; });
  document.querySelectorAll('[data-preset]').forEach(b=> b.onclick = ()=>{
    const id = b.getAttribute('data-preset');
    const keep = {tier:c.tier, premium:c.premium, ship:c.ship, target:c.target, credit:c.credit, sort:c.sort, species:c.species, hideRisk:c.hideRisk};
    S.sc = {...SC_DEFAULT, ...keep};
    if(id!=='clear'){ const p = SC_PRESETS.find(p=>p.id===id); Object.assign(S.sc, p.set, {preset:id}); }
    else S.sc.species = 'all';
    S.scLimit = 100; renderShell('screener');
  });
  scWireRefresh();
  scRenderResults();
}
function scWireRefresh(){
  const cp = document.getElementById('scCopyScript');
  if(cp) cp.onclick = async ()=>{
    const ta = document.getElementById('scScript');
    try{ await navigator.clipboard.writeText(SC_FEED_SCRIPT); toast('Feed script copied.'); }
    catch(e){ if(ta){ ta.focus(); ta.select(); } toast('Select-all is on — press ⌘C to copy.'); }
  };
  const inp = document.getElementById('scImport');
  if(inp) inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const msg = document.getElementById('scImportMsg'); if(msg) msg.textContent = 'Importing…';
    try{ const feed = JSON.parse(await f.text()); await importFeed(feed); toast(`Imported ${S.market.rows.length.toLocaleString()} listings.`); renderShell('screener'); }
    catch(e){ if(msg) msg.textContent = 'Import failed — '+(e && (e.message||e.code) || 'error'); }
  };
}
function scToEvaluate(id){
  const x = S.market.rows.find(r=>String(r.id)===String(id)); if(!x || !x.key) return;
  const c = scState(); const pieces = x.pieces||1;
  const {inp, t} = scModelInput(x, c);
  S.ev = {...EV_DEFAULT, species:x.key, carat:String(Math.round(Number(x.ct)/pieces*100)/100), tier:t.tier, form:inp.form, cut:inp.cut, clarity:inp.clarity, treatment:inp.treatment, origin:inp.origin, cert:inp.cert,
    ask:String(Math.round(x.price/pieces)), premium:String(c.premium||''), fees:String(Math.round((Number(c.ship)||0)/pieces)), title:x.t, link:scLink(x),
    notes:`From Auction Screener · Gem Rock listing ${x.id} · ${scEnds(x)} · seller ${x.s||'?'}${pieces>1?` · ${pieces} stones: figures are per stone`:''} · treatment as listed: ${x.tr||'not stated'} · clarity as listed: ${x.cl||'not stated'}.`};
  go('evaluate'); window.scrollTo({top:0});
}
async function scToggleWatch(gid){
  const key = 'GR-'+gid;
  if(S.watch[key]){
    delete S.watch[key];
    if(S.dbNS && S.ready){ try{ await S.dbNS.collection('watch').doc(key).delete(); }catch(e){ toast('Could not update the watchlist.'); } }
    toast('Removed from watchlist.');
  } else {
    const x = S.market.rows.find(r=>String(r.id)===String(gid)); if(!x) return;
    const v = scValue(x, scState());
    const rec = {gid:x.id, title:x.t, species:scSpLabel(x.key), ct:Number(x.ct), price:x.price, landed:v?v.landed:null, wsMid:v?v.wsMid:null, retail:v?v.retail:null, type:x.ty, endsAt:x.e||null, seller:x.s||null, addedAt:new Date().toISOString()};
    S.watch[key] = rec;
    if(S.dbNS && S.ready){ try{ await S.dbNS.collection('watch').doc(key).set(rec); }catch(e){ toast('Could not save to the watchlist.'); } }
    toast('Added to watchlist.');
  }
  if(S.route==='screener' && document.getElementById('scResults')){
    const ww = document.getElementById('scWatchWrap'); if(ww) ww.outerHTML = scWatchPanel();
    const wl = document.getElementById('sc_watchOnly'); if(wl && wl.parentElement) wl.parentElement.lastChild.textContent = ` Watchlist only (${Object.keys(S.watch).length})`;
    scRenderResults();
    document.querySelectorAll('#scWatchWrap [data-sceval]').forEach(b=> b.onclick = ()=> scToEvaluate(b.getAttribute('data-sceval')));
    document.querySelectorAll('#scWatchWrap [data-scwatch]').forEach(b=> b.onclick = ()=> scToggleWatch(b.getAttribute('data-scwatch')));
    renderNav('screener'); wireCommon();
  }
}

    <div class="tabs">
      <button class="tab ${DRAWER_TAB==='details'?'active':''}" data-tab="details">Details</button>
      <button class="tab ${DRAWER_TAB==='valuation'?'active':''}" data-tab="valuation">Valuation</button>
      <button class="tab ${DRAWER_TAB==='status'?'active':''}" data-tab="status">Status &amp; Comments</button>
      <button class="tab ${DRAWER_TAB==='ai'?'active':''}" data-tab="ai">Ask AI</button>
    </div>
    <div id="tabContent"></div>
  `;
  body.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=>{ DRAWER_TAB=b.getAttribute('data-tab'); renderDrawerBody(it); });
  const content = document.getElementById('tabContent');
  if(DRAWER_TAB==='details') content.innerHTML = DRAWER_EDITING ? tabEdit(it) : tabDetails(it);
  else if(DRAWER_TAB==='valuation') content.innerHTML = tabValuation(it);
  else if(DRAWER_TAB==='status') content.innerHTML = tabStatus(it);
  else if(DRAWER_TAB==='ai') content.innerHTML = tabAI(it);
  wireDrawerActions(it);
}

}

function itemContextForAI(it){
  const v = computeValuation(it);
  const clean = {...it};
  delete clean._docId; delete clean.hero;
  clean.media = `${(it.media||[]).filter(m=>m.type==='image').length} images, ${(it.media||[]).filter(m=>m.type==='video').length} videos on file (not viewable by the assistant)`;
  return JSON.stringify({record:clean, computedValuation:v}, null, 1);
}

async function askAI(it, question){
  const thread = AI_THREADS[it.id] = AI_THREADS[it.id] || [];
  thread.push({role:'user', text:question});
  renderDrawerBody(it);
  const threadEl = document.getElementById('aiThread');
  if(!S.sampleNS){
    thread.push({role:'ai', text:"The Ask AI assistant isn't available in this preview — it needs this page to be open on claude.ai with AI access granted."});
    renderDrawerBody(it);
    return;
  }
  thread.push({role:'ai', text:'Thinking…'});
  renderDrawerBody(it);
  try{
    const sys = `You are a gemology research assistant embedded in a personal collector's inventory app. You may ONLY use the JSON record and computed valuation given below as facts. Never invent certificates, origins, treatments, grades, prices, or market data that are not present in the record. When information needed to answer is missing from the record, say so explicitly and suggest what documentation or professional step (e.g. an independent gemologist) would resolve it. Clearly distinguish facts stated in the record from your own interpretation. Keep answers concise (under 180 words) and in plain language for a knowledgeable hobbyist, not a professional gemologist.\n\nITEM RECORD (JSON):\n${itemContextForAI(it)}`;
    const res = await S.sampleNS(
      [{role:'user', content: sys + '\n\nCOLLECTOR QUESTION: ' + question}],
      {onText:({text})=>{ thread[thread.length-1] = {role:'ai', text}; if(document.getElementById('aiThread')) renderThreadOnly(); }}
    );
    thread[thread.length-1] = {role:'ai', text: res.text};
  }catch(e){
    thread[thread.length-1] = {role:'ai', text: 'Could not reach the assistant (' + (e && e.code || 'error') + '). Please try again.'};
  }
  renderDrawerBody(it);
}
function renderThreadOnly(){
  // lightweight partial update during streaming
  const idEl = document.querySelector('.id-tag');
  const id = idEl ? idEl.textContent : null;
  const it = S.items.find(x=>x.id===id);
  if(!it) return;
  const el = document.getElementById('aiThread');
  if(!el) return;
  const thread = AI_THREADS[it.id]||[];
  el.innerHTML = thread.map(m=>`<div class="ai-msg ${m.role}">${escapeHtml(m.text)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

/* ---------- wiring for actions inside the drawer ---------- */
function wireDrawerActions(it){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); const id = el.getAttribute('data-open'); if(id) { history.replaceState('',document.title,location.pathname+location.search+'#item-'+id); openItemDrawer(id);} };
  });
  const editBtn = document.getElementById('editBtn');
  if(editBtn) editBtn.onclick = ()=>{ DRAWER_EDITING=true; renderDrawerBody(it); };
  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.onclick = ()=>{ DRAWER_EDITING=false; renderDrawerBody(it); };
  const saveEdit = document.getElementById('saveEdit');
  if(saveEdit) saveEdit.onclick = async ()=>{
    ['type','variety','caratActual','caratReported','dimensions','shape','cut','color','clarity','origin','treatment','certNumber','certIssuer','purchaseDate','purchasePriceUSD','purchaseMethod','vendorExcel'].forEach(k=>{
      const el = document.getElementById('ed_'+k); if(!el) return;
      let val = el.value;
      if(k==='caratActual'||k==='caratReported'||k==='purchasePriceUSD') val = val===''? null : Number(val);
      it[k]=val;
    });
    it.certStatus = document.getElementById('ed_certStatus').value;
    await saveItem(it);
    DRAWER_EDITING=false;
    renderShell(S.route);
    renderDrawer(it);
  };
  const deleteBtn = document.getElementById('deleteBtn');
  if(deleteBtn) deleteBtn.onclick = ()=> confirmDelete(it);
  if(document.getElementById('mm_species')){
    const sp = document.getElementById('mm_species');
    sp.onchange = ()=>{ // species changes the treatment / origin option lists
      const tr=document.getElementById('mm_treatment'), og=document.getElementById('mm_origin');
      tr.outerHTML = mmSelect('mm_treatment', mmTreatmentList(sp.value), mmTreatmentList(sp.value)[0].id);
      og.outerHTML = mmSelect('mm_origin', mmOriginList(sp.value), mmOriginList(sp.value)[0].id);
      ['mm_treatment','mm_origin'].forEach(id=>document.getElementById(id).onchange=()=>renderMmPreview(it));
      renderMmPreview(it);
    };
    ['mm_tier','mm_form','mm_cut','mm_clarity','mm_treatment','mm_origin','mm_cert'].forEach(id=>{ const el=document.getElementById(id); if(el) el.onchange=()=>renderMmPreview(it); });
    renderMmPreview(it);
    const save=document.getElementById('mmSave');
    if(save) save.onclick = async ()=>{
      const f=readMmForm();
      if(!f.tier){ toast('Choose a grade first.'); return; }
      Object.assign(it,{qualityGrade:f.tier, mmSpecies:f.species, mmForm:f.form, mmCut:f.cut, mmClarity:f.clarity, mmTreatment:f.treatment, mmOrigin:f.origin, mmCert:f.cert});
      await saveItem(it); renderShell(S.route); renderDrawerBody(it);
    };
    const clr=document.getElementById('mmClear');
    if(clr) clr.onclick = async ()=>{
      ['qualityGrade','mmSpecies','mmForm','mmCut','mmClarity','mmTreatment','mmOrigin','mmCert'].forEach(k=>delete it[k]);
      await saveItem(it); renderShell(S.route); renderDrawerBody(it);
    };
  }
  document.querySelectorAll('#drawerBody [data-lb]').forEach(el=>{
    el.onclick = ()=> openLightbox(it, parseInt(el.getAttribute('data-lb'),10)||0);
  });

  const chkSold = document.getElementById('chkSold');
  const chkGifted = document.getElementById('chkGifted');
  if(chkSold) chkSold.onchange = ()=>{ document.getElementById('soldFields').style.display = chkSold.checked?'':'none'; };
  if(chkGifted) chkGifted.onchange = ()=>{ document.getElementById('giftedFields').style.display = chkGifted.checked?'':'none'; };
  const saveStatus = document.getElementById('saveStatus');
  if(saveStatus) saveStatus.onclick = async ()=>{
    it.sold = chkSold.checked; it.gifted = chkGifted.checked;
    if(it.sold){ it.saleDate=val('ed_saleDate'); it.saleAmount=numval('ed_saleAmount'); it.buyer=val('ed_buyer'); it.saleNotes=val('ed_saleNotes'); }
    if(it.gifted){ it.giftDate=val('ed_giftDate'); it.giftRecipient=val('ed_giftRecipient'); it.giftNotes=val('ed_giftNotes'); }
    await saveItem(it);
    renderShell(S.route);
    renderDrawerBody(it);
  };
  const saveComments = document.getElementById('saveComments');
  if(saveComments) saveComments.onclick = async ()=>{ it.comments = val('ed_comments'); await saveItem(it); };

  document.querySelectorAll('[data-ask]').forEach(b=> b.onclick = ()=> askAI(it, b.getAttribute('data-ask')));
  const aiSend = document.getElementById('aiSend');
  if(aiSend) aiSend.onclick = ()=>{ const inp=document.getElementById('aiInput'); if(inp.value.trim()){ askAI(it, inp.value.trim()); inp.value=''; } };
  const aiInput = document.getElementById('aiInput');
  if(aiInput) aiInput.onkeydown = (e)=>{ if(e.key==='Enter' && aiInput.value.trim()){ askAI(it, aiInput.value.trim()); aiInput.value=''; } };
}
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function numval(id){ const el=document.getElementById(id); return el&&el.value!==''?Number(el.value):null; }

function confirmDelete(it){
  const conf = document.createElement('div');
  conf.className='overlay'; conf.style.alignItems='center'; conf.style.justifyContent='center';
  conf.innerHTML = `<div class="panel" style="max-width:400px;margin:0;">
    <h3>Remove ${escapeHtml(it.id)} from the library?</h3>
    <p style="font-size:13px;color:var(--ink-soft);">The record is <strong>archived, not destroyed</strong>: it disappears from the libraries, dashboard and valuation totals, its ID is never reused, and you can restore it any time from <em>Data / Import → Archived records</em>. If the stone left your possession, marking it Sold or Gifted is usually the better choice.</p>
    <div class="field" style="border:none;"><div class="fl">Reason (optional)</div><input id="archReason" placeholder="e.g. duplicate entry, recorded in error"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-danger" id="confirmDel">Archive record</button>
      <button class="btn" id="cancelDel">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(conf);
  conf.querySelector('#cancelDel').onclick = ()=> conf.remove();
  conf.querySelector('#confirmDel').onclick = async ()=>{
    const reason = conf.querySelector('#archReason').value.trim();
    await archiveItem(it, reason || 'Archived by the collector.');
    conf.remove();
    closeDrawer();
    history.replaceState('',document.title,location.pathname+location.search);
    renderShell(S.route);
    toast(it.id + ' archived — restore it from Data / Import.');
  };
}

/* =========================================================================
   ADD ITEM
   ========================================================================= */
function openAddForm(isOpal){
  const root = document.getElementById('overlayRoot');
  const id = nextId(isOpal);
  root.innerHTML = `<div class="overlay" id="ovlAdd"><div class="drawer">
    <div class="drawer-head"><div><div class="id-tag">${id}</div><h2>Add ${isOpal?'Opal':'Gemstone'}</h2></div><button class="close-x" id="closeAdd">&times;</button></div>
    <div class="drawer-body">
      <div class="field-grid">
        <div class="field"><div class="fl">Type *</div><input id="new_type" placeholder="${isOpal?'Opal':'e.g. Sapphire'}" value="${isOpal?'Opal':''}"></div>
        <div class="field"><div class="fl">Variety</div><input id="new_variety" placeholder="${isOpal?'e.g. Welo Opal':'e.g. Padparadscha'}"></div>
        <div class="field"><div class="fl">Carat (actual)</div><input id="new_caratActual" type="number" step="0.01"></div>
        <div class="field"><div class="fl">Dimensions</div><input id="new_dimensions" placeholder="L x W x D mm"></div>
        <div class="field"><div class="fl">Shape</div><input id="new_shape"></div>
        <div class="field"><div class="fl">Color</div><input id="new_color"></div>
        <div class="field"><div class="fl">Clarity</div><input id="new_clarity"></div>
        <div class="field"><div class="fl">Origin</div><input id="new_origin"></div>
        <div class="field"><div class="fl">Treatment</div><input id="new_treatment"></div>
        <div class="field"><div class="fl">Certification status</div>
          <select id="new_certStatus">${['Unknown / Not Documented','Auction Verified','Certified','Seller Described'].map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
        <div class="field"><div class="fl">Certificate number</div><input id="new_certNumber"></div>
        <div class="field"><div class="fl">Certificate issuer</div><input id="new_certIssuer"></div>
        <div class="field"><div class="fl">Purchase date</div><input id="new_purchaseDate" placeholder="YYYY-MM-DD"></div>
        <div class="field"><div class="fl">Purchase price (USD)</div><input id="new_purchasePriceUSD" type="number"></div>
        <div class="field"><div class="fl">Seller</div><input id="new_vendorExcel"></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="saveNew">Add ${isOpal?'Opal':'Gemstone'}</button>
        <button class="btn" id="cancelNew">Cancel</button>
      </div>
    </div>
  </div></div>`;
  document.getElementById('closeAdd').onclick = closeDrawer;
  document.getElementById('cancelNew').onclick = closeDrawer;
  document.getElementById('ovlAdd').addEventListener('mousedown', e=>{ if(e.target.id==='ovlAdd') closeDrawer(); });
  document.getElementById('saveNew').onclick = async ()=>{
    const type = val('new_type').trim();
    if(!type){ toast('Type is required.'); return; }
    const it = {
      id, opal: isOpal, type, variety: val('new_variety')||null,
      caratActual: numval('new_caratActual'), caratReported: numval('new_caratActual'),
      dimensions: val('new_dimensions')||null, shape: val('new_shape')||null, color: val('new_color')||null,
      clarity: val('new_clarity')||null, origin: val('new_origin')||null, treatment: val('new_treatment')||null,
      certStatus: val('new_certStatus'), certNumber: val('new_certNumber')||null, certIssuer: val('new_certIssuer')||null,
      purchaseDate: val('new_purchaseDate')||null, purchasePriceUSD: numval('new_purchasePriceUSD'),
      vendorExcel: val('new_vendorExcel')||null, inExcel:false, inPurchasePrices:false, hero:null,
      sold:false, gifted:false, comments:'', conflicts:[], notes:['Added manually through the app.'],
      createdAt: new Date().toISOString(),
    };
    S.items.push(it);
    await saveItem(it);
    closeDrawer();
    go(isOpal?'opals':'gems');
    toast(`${id} added.`);
  };
}

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot(){
  renderNav('dashboard');
  document.getElementById('main').innerHTML = '<div class="empty-state">Loading your collection…</div>';
  await initCapabilities();
  await loadItems();
  route();
}

if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
} else {
  boot();
}
</script>
