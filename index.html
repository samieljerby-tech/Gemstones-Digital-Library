<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gemstones Digital Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f0ede4; --border:#e2ddd0;
  --ink:#241f1a; --ink-soft:#6b6353; --ink-faint:#a49c88;
  --accent:#5c6e4f; --accent-ink:#f6f4ef; --gold:#a9812f; --gold-soft:#e9d8ab;
  --ruby:#8c2f39; --emerald:#296b4a; --sapphire:#2c4a7c; --opal-a:#7a5ba6; --opal-b:#2f9e8f; --opal-c:#c96b8a;
  --good:#3d7a4f; --warn:#a9711f; --bad:#a53f3f;
  --shadow: 0 1px 2px rgba(36,31,26,.06), 0 8px 24px -12px rgba(36,31,26,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181613; --surface:#211e19; --surface-2:#28241e; --border:#3a352b;
    --ink:#efe9dd; --ink-soft:#b6ac97; --ink-faint:#80765f;
    --accent:#8ca377; --accent-ink:#14140f; --gold:#d9b662; --gold-soft:#4a3d1f;
    --ruby:#d97b83; --emerald:#6fb894; --sapphire:#7ea3d6; --opal-a:#b79ee0; --opal-b:#6cd2c1; --opal-c:#e6a0bc;
    --good:#7bc492; --warn:#e0ab5c; --bad:#e08787;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181613; --surface:#211e19; --surface-2:#28241e; --border:#3a352b;
  --ink:#efe9dd; --ink-soft:#b6ac97; --ink-faint:#80765f;
  --accent:#8ca377; --accent-ink:#14140f; --gold:#d9b662; --gold-soft:#4a3d1f;
  --ruby:#d97b83; --emerald:#6fb894; --sapphire:#7ea3d6; --opal-a:#b79ee0; --opal-b:#6cd2c1; --opal-c:#e6a0bc;
  --good:#7bc492; --warn:#e0ab5c; --bad:#e08787;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;font-size:14px;line-height:1.5;}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0 0 .3em;letter-spacing:-.01em;text-wrap:balance;}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
::selection{background:var(--gold-soft);}

.app-shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand-mark{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--emerald),var(--sapphire),var(--opal-a),var(--ruby),var(--gold),var(--emerald));flex:none;box-shadow:inset 0 0 0 2px var(--surface), 0 0 0 1px var(--border);}
.brand-text .t1{font-family:"Fraunces",serif;font-weight:600;font-size:15.5px;line-height:1.15;}
.brand-text .t2{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}

.nav-group{margin-bottom:16px;}
.nav-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:0 10px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--ink-soft);padding:8px 10px;border-radius:8px;font-size:13.5px;margin-bottom:1px;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--surface-2);color:var(--accent);font-weight:600;}
.nav-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-faint);}
.nav-item.active .nav-dot{background:var(--accent);}
.nav-count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-faint);}

.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-faint);}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1360px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:border-color .15s;white-space:nowrap;}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{border-color:transparent;background:none;}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn-danger{color:var(--bad);}

/* Dashboard */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:6px;}
.stat-card .value{font-family:"Fraunces",serif;font-size:24px;font-weight:600;}
.stat-card .sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.stat-card.accent{border-color:var(--accent);background:linear-gradient(180deg,var(--surface),var(--surface-2));}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h3{font-size:15.5px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
.bar-label{width:128px;flex:none;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);}
.bar-val{width:64px;flex:none;text-align:right;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:11px;}

/* toolbar / filters */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box input{width:100%;padding:9px 12px 9px 32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint);}
select, .fbtn{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12.5px;}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:4px 10px 4px 9px;font-size:11.5px;background:var(--surface-2);color:var(--ink-soft);}
.chip button{background:none;border:none;color:inherit;padding:0;font-size:13px;line-height:1;}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:920px;}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--ink);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--surface-2);flex:none;box-shadow:0 0 0 1px var(--border);}
.thumb-ph{width:38px;height:38px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:9px;box-shadow:0 0 0 1px var(--border);}
.row-title{font-weight:600;}
.row-sub{color:var(--ink-faint);font-size:11px;}
.id-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.badge-certified{background:rgba(61,122,79,.14);color:var(--good);}
.badge-verified{background:rgba(169,113,31,.14);color:var(--warn);}
.badge-unknown{background:rgba(165,63,63,.12);color:var(--bad);}
.badge-active{background:rgba(61,122,79,.14);color:var(--good);}
.badge-sold{background:rgba(44,74,124,.14);color:var(--sapphire);}
.badge-gifted{background:rgba(122,91,166,.14);color:var(--opal-a);}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--warn);}
.flag.bad{color:var(--bad);}
.flag.ok{color:var(--good);}

.icon-btn{border:none;background:none;color:var(--ink-faint);padding:4px 6px;border-radius:6px;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}

/* cards grid (library grid view) */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.gem-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s, border-color .12s;}
.gem-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.gem-card .img-wrap{aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;position:relative;}
.gem-card img{width:100%;height:100%;object-fit:cover;display:block;}
.gem-card .img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;text-align:center;padding:10px;}
.gem-card .body{padding:11px 13px 13px;}
.gem-card .gtype{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);}
.gem-card .gname{font-family:"Fraunces",serif;font-weight:600;font-size:15px;margin:2px 0 5px;}
.gem-card .grow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
.status-strip{position:absolute;top:8px;right:8px;display:flex;gap:4px;}

/* view toggle */
.viewtoggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.viewtoggle button{padding:7px 10px;background:var(--surface);border:none;color:var(--ink-faint);}
.viewtoggle button.active{background:var(--accent);color:var(--accent-ink);}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(20,17,13,.5);backdrop-filter:blur(1px);z-index:40;display:flex;justify-content:flex-end;}
.drawer{width:min(760px,100%);background:var(--bg);height:100%;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.2);}
.drawer-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2;}
.drawer-body{padding:20px 22px 60px;}
.close-x{border:none;background:var(--surface-2);width:30px;height:30px;border-radius:50%;color:var(--ink-soft);font-size:16px;line-height:1;flex:none;}

.detail-hero{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-bottom:18px;}
@media (max-width:560px){.detail-hero{grid-template-columns:1fr;}}
.detail-hero .img-wrap{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px var(--border);}
.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-hero .img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;text-align:center;padding:10px;}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
@media (max-width:560px){.field-grid{grid-template-columns:1fr;}}
.field{padding:7px 0;border-bottom:1px dashed var(--border);}
.field .fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:2px;}
.field .fv{font-size:13.5px;}
.field .fv.empty{color:var(--ink-faint);font-style:italic;}
.field input, .field select, .field textarea{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit;}
.field textarea{resize:vertical;min-height:60px;}

.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

.val-box{background:var(--surface-2);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.val-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.val-row .k{color:var(--ink-soft);font-size:12.5px;}
.val-row .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;}
.conf-pill{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}
.conf-medium{background:rgba(169,113,31,.15);color:var(--warn);}
.conf-low{background:rgba(165,63,63,.13);color:var(--bad);}
.conf-none{background:var(--surface);color:var(--ink-faint);border:1px dashed var(--border);}
.val-explain{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-top:8px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:8px 4px;background:none;border:none;color:var(--ink-faint);font-size:13px;border-bottom:2px solid transparent;margin-right:14px;}
.tab.active{color:var(--ink);border-color:var(--accent);font-weight:600;}

.status-toggle-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.status-check{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;cursor:pointer;background:var(--surface);}
.status-check input{width:15px;height:15px;accent-color:var(--accent);}
.status-check.on{border-color:var(--accent);background:var(--surface-2);}

.ai-box{background:var(--surface-2);border-radius:10px;padding:14px;}
.ai-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ai-suggest button{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);}
.ai-suggest button:hover{border-color:var(--accent);color:var(--accent);}
.ai-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;max-height:340px;overflow-y:auto;}
.ai-msg{padding:9px 12px;border-radius:10px;font-size:12.8px;line-height:1.5;}
.ai-msg.user{background:var(--accent);color:var(--accent-ink);align-self:flex-end;max-width:82%;}
.ai-msg.ai{background:var(--surface);border:1px solid var(--border);max-width:92%;white-space:pre-wrap;}
.ai-input-row{display:flex;gap:8px;}
.ai-input-row input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:12.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);}

.note-list{display:flex;flex-direction:column;gap:6px;}
.note-item{font-size:12px;color:var(--warn);display:flex;gap:6px;}
.conflict-item{font-size:12px;color:var(--bad);background:rgba(165,63,63,.08);padding:8px 10px;border-radius:8px;margin-bottom:6px;}

.mobile-nav-toggle{display:none;}
@media (max-width:840px){
  .sidebar{position:fixed;left:-260px;top:0;z-index:50;transition:left .2s;box-shadow:var(--shadow);}
  .sidebar.open{left:0;}
  .mobile-nav-toggle{display:flex;position:sticky;top:10px;z-index:30;margin:10px 0 0 10px;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;}
  .main{padding:0 16px 60px;}
}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}


/* evaluator */
.grade-sel{padding:4px 6px;font-size:11.5px;border-radius:6px;}
.ev-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start;}
@media (max-width:1000px){.ev-grid{grid-template-columns:1fr;}}
.ev-result{position:sticky;top:12px;}
@media (max-width:1000px){.ev-result{position:static;}}
.ev-verdict{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12.8px;line-height:1.5;}
.ev-vlabel{font-family:"Fraunces",serif;font-size:19px;font-weight:600;margin-bottom:2px;}
.ev-good{background:rgba(61,122,79,.12);color:var(--good);}
.ev-warn{background:rgba(169,113,31,.13);color:var(--warn);}
.ev-bad{background:rgba(165,63,63,.12);color:var(--bad);}
.ev-figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
@media (max-width:560px){.ev-figs{grid-template-columns:1fr 1fr;}}
.ev-figs>div{background:var(--surface-2);border-radius:10px;padding:10px 12px;}
.ev-figs .label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);}
.ev-figs .value{font-family:"Fraunces",serif;font-size:21px;font-weight:600;margin:2px 0;}
.ev-figs .sub{font-size:11px;color:var(--ink-soft);}
.ev-figs .ev-retail{background:var(--accent);color:var(--accent-ink);}
.ev-figs .ev-retail .label,.ev-figs .ev-retail .sub{color:var(--accent-ink);opacity:.85;}
.ev-scale{position:relative;height:26px;background:var(--surface-2);border-radius:6px;margin:26px 0 8px;}
.ev-band{position:absolute;top:5px;height:16px;border-radius:4px;}
.ev-band-ws{background:var(--sapphire);opacity:.55;}
.ev-band-rt{background:var(--gold);opacity:.55;}
.ev-pin{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);}
.ev-pin span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:4px;}
.ev-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
.ev-sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* gallery + lightbox */
.detail-hero .img-wrap.clickable{cursor:zoom-in;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;}
.g-item{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:9px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px var(--border);cursor:zoom-in;}
.g-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s;}
.g-item:hover img{transform:scale(1.06);}
.g-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.g-video{background:linear-gradient(135deg,var(--opal-a),var(--opal-b));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.g-play{font-size:20px;line-height:1;}
.g-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(12,10,8,.92);display:flex;flex-direction:column;}

<script>
/* =========================================================================
   GEMSTONES DIGITAL LIBRARY — data layer, valuation engine, render, router
   ========================================================================= */


const NAV = [
  {id:'dashboard', label:'Dashboard'},
  {id:'gems', label:'Gemstones Library'},
  {id:'opals', label:'Opals Library'},
  {id:'valuation', label:'Valuation'},
  {id:'evaluate', label:'Evaluate a Purchase'},
  {id:'screener', label:'Auction Screener'},
  {id:'sold-gifted', label:'Sold / Gifted'},
  {id:'review', label:'Needs Review'},
  {id:'data', label:'Data / Import'},
];

/* ---------- reference grading data (from the collector's own Gemstone Charts folder) ---------- */
const REFERENCE = {
  sapphireColor: {source:"Gemstone Charts / blue-sapphire-color-grade.png", scale:["Good (A)","Better (AA)","Best (AAA)","Heirloom (AAAA)"]},
  tanzanite: {source:"Gemstone Charts / tanzanite-grading-table.jpg", color:["A (Pale)","AA (Moderate)","AAA (Intense)","AAAA (Vivid)"], clarity:"GIA coloured-stone system: IF, VVS, VS, SI, I1-I3"},
  topaz: {source:"Gemstone Charts / Topaz Grading scale.jpg", scale:["A","AA","AAA"]},
  diamondClarity: {source:"Gemstone Charts / Diamond-clarity-chart.jpg + diamond-clarity-scale-2.jpg", scale:["FL/IF","VVS1-VVS2","VS1-VS2","SI1-SI2","I1-I3"]},
  emerald: {source:"Gemstone Charts / Emrald Quality Chart.jpeg", scale:["2 Very Light","3 Light","4 Medium Light","5 Medium","6 Medium Dark","7 Dark","8 Very Dark"]},
};

/* ---------- app state ---------- */
const S = {
  items: [],
  archived: [],
  evals: [],
  dbNS: null,
  assetsNS: null,
  sampleNS: null,
  ready: false,
  filters: { q:'', cert:'all', status:'active', origin:'all', treatment:'all', sort:'id-asc' },
  view: 'grid', // grid | table  (per-library)
  route: 'dashboard',
};

function uid(){ return 'n' + Math.random().toString(36).slice(2,10); }

function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.innerHTML=''; root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtUSD(n){ if(n===null||n===undefined||isNaN(n)) return null; return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtNum(n,d=2){ if(n===null||n===undefined||n==='') return null; const v=Number(n); if(isNaN(v)) return String(n); return v.toLocaleString('en-US',{maximumFractionDigits:d}); }
function isEmpty(v){ return v===null||v===undefined||v===''||v==='Not documented'||v==='NA'||v==='Not applicable (rough)'; }

/* =========================================================================
   VALUATION ENGINE
   Hierarchy: L1 direct evidence > L2 chart/reference classification >
   L3 reasoned market estimate (heuristic, clearly labeled) > L4 insufficient.
   This collection's source files contain no documented $/ct market comps or
   lab appraisals — only acquisition price and (for some items) quality
   descriptors. So every figure here is either L3 (a transparent, labeled
   heuristic applied to the recorded purchase price) or L4 (insufficient
   data). Nothing here is a lab appraisal or a sourced market quote.
   ========================================================================= */
function acquisitionValuation(it){
  const out = {level:null, confidence:'None', wholesaleLow:null, wholesaleHigh:null,
    retailLow:null, retailHigh:null, basis:[], missing:[]};

  if(isEmpty(it.purchasePriceUSD)){
    out.level = 4;
    out.confidence = 'Insufficient';
    out.missing.push('No purchase price is recorded for this item in any source file.');
    if(isEmpty(it.caratActual)) out.missing.push('Carat weight is not documented.');
    if(isEmpty(it.clarity)) out.missing.push('Clarity / quality grade is not documented.');
    return out;
  }

  const price = Number(it.purchasePriceUSD);
  const treatment = (it.treatment||'').toLowerCase();
  const isRough = /rough|specimen|uncut/i.test(it.shape||'') || /rough/i.test(it.type||'');
  const isCertified = it.certStatus === 'Certified';
  const isVerified = it.certStatus === 'Auction Verified';
  const isUntreated = /natural|untreated|unheated|no oil/.test(treatment) && !/heated|oiled|coated/.test(treatment);

  // base multiplier band: purchase price -> estimated wholesale
  let wLow, wHigh, wLabel;
  if(isRough){
    wLow = price*0.8; wHigh = price*1.3;
    wLabel = 'rough / uncut material — thin resale market, cutting yield and window risk keep wholesale close to acquisition cost';
  } else if(isCertified && isUntreated){
    wLow = price*1.4; wHigh = price*2.2;
    wLabel = 'independently lab-certified and untreated — the strongest tier in this collection, supports the widest premium over acquisition cost';
  } else if(isCertified){
    wLow = price*1.25; wHigh = price*1.9;
    wLabel = 'independently lab-certified, but treated — certification still adds confidence, treatment caps the premium';
  } else if(isVerified && isUntreated){
    wLow = price*1.1; wHigh = price*1.7;
    wLabel = 'auction-verified only (no independent lab certificate) but untreated — moderate premium';
  } else if(isVerified){
    wLow = price*0.9; wHigh = price*1.4;
    wLabel = 'auction-verified only, and treated (heated / oiled / coated) — treatment and lack of independent certification limit upside';
  } else {
    wLow = price*0.8; wHigh = price*1.3;
    wLabel = 'verification status and/or treatment are undocumented — treated conservatively, close to acquisition cost';
  }

  // carat-size premium for large stones of rare/high-value species (big auction discounts on
  // large fine material are typically the widest, so the wholesale re-rate is largest here)
  const bigSpecies = /ruby|sapphire|emerald|tanzanite/i.test(it.type||'');
  const carat = Number(it.caratActual || it.caratReported || 0);
  if(bigSpecies && !isRough && carat >= 3){
    const bump = carat >= 8 ? 1.25 : carat >= 5 ? 1.15 : 1.08;
    wLow *= bump; wHigh *= bump;
  }

  out.wholesaleLow = Math.round(wLow);
  out.wholesaleHigh = Math.round(wHigh);
  // retail band: standard colored-gemstone trade markup over wholesale (general trade
  // knowledge, not sourced from the collector's own files)
  out.retailLow = Math.round(wLow * (isRough?1.3:1.6));
  out.retailHigh = Math.round(wHigh * (isRough?1.8:2.4));

  out.level = 3;
  out.confidence = (isCertified && !isEmpty(it.clarity) && !isEmpty(it.caratActual)) ? 'Medium' : 'Low';
  out.basis.push(`Documented acquisition price: ${fmtUSD(price)} (${it.purchaseMethod||'method not documented'}, ${it.purchaseDate||'date not documented'}).`);
  out.basis.push(`Verification tier: ${it.certStatus} — ${wLabel}.`);
  if(bigSpecies && !isRough && carat>=3) out.basis.push(`Carat-size premium applied: ${it.type} at ${fmtNum(carat)} ct is large for the species, which typically commands a disproportionate premium.`);
  if(!isEmpty(it.clarity)) out.basis.push(`Recorded clarity/quality: ${it.clarity}.`);
  if(!isEmpty(it.color)) out.basis.push(`Recorded color: ${it.color}.`);
  out.basis.push('No independent market comparable, dealer quote or lab appraisal was found in the source files — this range is a transparent heuristic (acquisition price × a verification/treatment-based multiplier, plus standard trade wholesale→retail markup), not a documented or sourced valuation.');
  if(isEmpty(it.clarity)) out.missing.push('Clarity / quality grade not documented.');
  if(isEmpty(it.origin) || it.origin==='Not documented') out.missing.push('Origin not documented.');
  if(it.certStatus!=='Certified') out.missing.push('No independent laboratory certificate on file.');

  return out;
}

/* =========================================================================
   MARKET REFERENCE MODEL  (used by "Evaluate Before Buying" and by any
   collection item you grade A / AA / AAA / AAAA)
   -------------------------------------------------------------------------
   Indicative RETAIL $/ct at a 1 ct reference size, per colour-quality tier
   (A = commercial/light, AA = good/moderate, AAA = fine/vivid,
   AAAA = top/exceptional — the same A–AAAA scale as your Gemstone Charts).
   Compiled from published 2025–26 dealer price guides (tanzanite, emerald,
   ruby, sapphire, amethyst, Ethiopian opal) and adjusted DOWN toward
   online-auction/trade levels, because dealer "retail charts" run well
   above what stones actually trade for. These are reference bands, not
   quotes: they cannot see the stone, and a lab report or dealer quote
   always overrides them.
   Wholesale = retail ÷ trade markup (colored stones typically retail at
   2–4× wholesale: low = ÷3.2, mid = ÷2.5, high = ÷2.0).
   ========================================================================= */
const MM_SPECIES = {
  ruby:            {label:'Ruby',                         tiers:[150, 600, 2500, 7000],  exp:0.45, family:'corundum'},
  'sapphire-blue': {label:'Sapphire — blue',              tiers:[100, 450, 1500, 4000],  exp:0.40, family:'corundum'},
  'sapphire-pink': {label:'Sapphire — pink / purple',     tiers:[120, 450, 1400, 3500],  exp:0.40, family:'corundum'},
  'sapphire-padparadscha': {label:'Sapphire — padparadscha', tiers:[500,1500,4000,10000], exp:0.45, family:'corundum'},
  'sapphire-yellow':{label:'Sapphire — yellow / orange / green', tiers:[60, 200, 600, 1500], exp:0.35, family:'corundum'},
  'sapphire-white':{label:'Sapphire — white / colourless',tiers:[40, 120, 300, 700],     exp:0.30, family:'corundum'},
  emerald:         {label:'Emerald',                      tiers:[120, 500, 2000, 6000],  exp:0.40, family:'emerald'},
  tanzanite:       {label:'Tanzanite',                    tiers:[100, 220, 300, 425],    exp:0.55, family:'tanzanite'},
  'spinel-red':    {label:'Spinel — red / hot pink',      tiers:[150, 500, 1800, 5000],  exp:0.40, family:'spinel'},
  'spinel-other':  {label:'Spinel — purple / grey / blue',tiers:[60, 180, 500, 1500],    exp:0.35, family:'spinel'},
  alexandrite:     {label:'Alexandrite',                  tiers:[800, 3000, 10000, 25000],exp:0.45, family:'other'},
  'tsavorite':     {label:'Garnet — tsavorite',           tiers:[150, 500, 1500, 3500],  exp:0.40, family:'other'},
  'garnet':        {label:'Garnet — rhodolite / almandine / other', tiers:[10, 40, 100, 250], exp:0.15, family:'other'},
  aquamarine:      {label:'Aquamarine',                   tiers:[30, 120, 350, 700],     exp:0.30, family:'other'},
  morganite:       {label:'Morganite',                    tiers:[20, 60, 150, 300],      exp:0.20, family:'other'},
  tourmaline:      {label:'Tourmaline (non-Paraíba)',     tiers:[30, 120, 400, 1200],    exp:0.30, family:'other'},
  peridot:         {label:'Peridot',                      tiers:[15, 50, 120, 250],      exp:0.25, family:'other'},
  zircon:          {label:'Zircon',                       tiers:[30, 100, 250, 500],     exp:0.25, family:'other'},
  sphene:          {label:'Sphene (titanite)',            tiers:[40, 120, 350, 800],     exp:0.30, family:'other'},
  sphalerite:      {label:'Sphalerite (collector)',       tiers:[20, 60, 150, 400],      exp:0.20, family:'other'},
  'topaz-imperial':{label:'Topaz — golden / imperial / pink (natural colour)', tiers:[15, 40, 120, 400], exp:0.15, family:'topaz'},
  'topaz-blue':    {label:'Topaz — blue (irradiated, e.g. Swiss/London)', tiers:[4, 8, 15, 25], exp:0.05, family:'topaz'},
  'topaz-coated':  {label:'Topaz — mystic / coated',      tiers:[2, 4, 7, 10],           exp:0.00, family:'topaz'},
  amethyst:        {label:'Amethyst',                     tiers:[4, 9, 20, 40],          exp:0.10, family:'quartz'},
  citrine:         {label:'Citrine',                      tiers:[4, 10, 20, 40],         exp:0.10, family:'quartz'},
  turquoise:       {label:'Turquoise (cabochon)',         tiers:[2, 8, 25, 80],          exp:0.00, family:'other'},
  'opal-ethiopian':{label:'Opal — Ethiopian (Welo), cut', tiers:[20, 60, 150, 400],      exp:0.20, family:'opal'},
  'opal-australian':{label:'Opal — Australian (black / boulder / crystal), cut', tiers:[30, 150, 600, 2500], exp:0.30, family:'opal'},
};
const MM_TIERS = [
  {id:'A',    label:'A — commercial / light colour'},
  {id:'AA',   label:'AA — good / moderate colour'},
  {id:'AAA',  label:'AAA — fine / vivid colour'},
  {id:'AAAA', label:'AAAA — top / exceptional'},
];
const MM_FORMS = [
  {id:'faceted', label:'Faceted', mult:1},
  {id:'cabochon', label:'Cabochon', mult:0.8},
  {id:'rough', label:'Rough (uncut, gem-grade)', mult:0.3},
  {id:'specimen', label:'Rough specimen / parcel', mult:0.12},
];
const MM_CUT = [
  {id:'excellent', label:'Excellent / precision', mult:1.1},
  {id:'good', label:'Good', mult:1.0},
  {id:'fair', label:'Fair (windowed / off-proportion)', mult:0.8},
  {id:'poor', label:'Poor (needs recut)', mult:0.6},
];
const MM_CLARITY = [
  {id:'clean', label:'Eye-clean (VVS–VS)', mult:1.0, emerald:1.0},
  {id:'slight', label:'Slightly included (SI)', mult:0.8, emerald:0.9},
  {id:'included', label:'Included (I1–I2)', mult:0.55, emerald:0.7},
  {id:'heavy', label:'Heavily included / translucent-opaque', mult:0.3, emerald:0.45},
];
const MM_TREATMENT = {
  corundum: [{id:'heated',label:'Heated (standard)',mult:1},{id:'unheated',label:'Unheated / no treatment',mult:1.8},{id:'filled',label:'Glass / lead-glass filled',mult:0.05},{id:'diffused',label:'Diffusion (Be / surface)',mult:0.2},{id:'unknown',label:'Not disclosed',mult:0.8}],
  emerald:  [{id:'minor',label:'Minor oil (standard)',mult:1},{id:'none',label:'No oil / untreated',mult:1.6},{id:'moderate',label:'Moderate oil',mult:0.75},{id:'significant',label:'Significant oil',mult:0.5},{id:'resin',label:'Resin / polymer filled',mult:0.4},{id:'unknown',label:'Not disclosed',mult:0.7}],
  tanzanite:[{id:'heated',label:'Heated (standard)',mult:1},{id:'unheated',label:'Unheated',mult:1.05},{id:'coated',label:'Coated',mult:0.2},{id:'unknown',label:'Not disclosed',mult:0.9}],
  spinel:   [{id:'none',label:'Untreated (standard)',mult:1},{id:'heated',label:'Heated',mult:0.6},{id:'unknown',label:'Not disclosed',mult:0.85}],
  topaz:    [{id:'standard',label:'Standard for type',mult:1},{id:'unknown',label:'Not disclosed',mult:0.9}],
  quartz:   [{id:'standard',label:'Natural / standard heat',mult:1},{id:'unknown',label:'Not disclosed',mult:0.95}],
  opal:     [{id:'none',label:'Untreated',mult:1},{id:'smoked',label:'Smoked / dyed / sugar-acid',mult:0.3},{id:'stabilised',label:'Stabilised / doublet-triplet',mult:0.15},{id:'unknown',label:'Not disclosed',mult:0.8}],
  other:    [{id:'none',label:'Untreated / standard',mult:1},{id:'treated',label:'Treated (heat/irradiation)',mult:0.8},{id:'filled',label:'Filled / coated',mult:0.3},{id:'unknown',label:'Not disclosed',mult:0.85}],
};
const MM_ORIGIN = {
  ruby:[{id:'std',label:'Mozambique / East Africa (baseline)',mult:1},{id:'burma',label:'Burma (Myanmar)',mult:1.5},{id:'thai',label:'Thailand / Cambodia',mult:0.85},{id:'other',label:'Other / unknown',mult:0.85}],
  corundum:[{id:'std',label:'Madagascar / Sri Lanka / Africa (baseline)',mult:1},{id:'kashmir',label:'Kashmir',mult:3},{id:'burma',label:'Burma',mult:1.3},{id:'ceylon',label:'Sri Lanka (Ceylon) — premium',mult:1.15},{id:'aus',label:'Australia / Thailand',mult:0.7},{id:'other',label:'Other / unknown',mult:0.9}],
  emerald:[{id:'std',label:'Zambia (baseline)',mult:1},{id:'colombia',label:'Colombia',mult:1.3},{id:'brazil',label:'Brazil',mult:0.75},{id:'other',label:'Other / unknown',mult:0.8}],
  spinel:[{id:'std',label:'Sri Lanka / Vietnam (baseline)',mult:1},{id:'burma',label:'Burma (Mogok)',mult:1.3},{id:'mahenge',label:'Tanzania (Mahenge)',mult:1.2},{id:'other',label:'Other / unknown',mult:0.9}],
  none:[{id:'std',label:'Not a major price factor for this gem',mult:1}],
};
const MM_CERT = [
  {id:'major', label:'Major independent lab (GIA, GRS, SSEF, Gübelin, AGL, Lotus)', mult:1.1, conf:1},
  {id:'minor', label:'Other lab report (GCI, IGI, AIGS, seller lab…)', mult:1.0, conf:0.5},
  {id:'auction', label:'Auction / seller description only', mult:0.95, conf:0},
  {id:'none', label:'Nothing / undisclosed', mult:0.85, conf:-0.5},
];
const MM_MARKUP = {low:3.2, mid:2.5, high:2.0};

function mmOriginList(key){
  const sp = MM_SPECIES[key]; if(!sp) return MM_ORIGIN.none;
  if(key==='ruby') return MM_ORIGIN.ruby;
  if(sp.family==='corundum') return MM_ORIGIN.corundum;
  if(sp.family==='emerald') return MM_ORIGIN.emerald;
  if(sp.family==='spinel') return MM_ORIGIN.spinel;
  return MM_ORIGIN.none;
}
function mmTreatmentList(key){ const sp=MM_SPECIES[key]; return MM_TREATMENT[sp? sp.family : 'other'] || MM_TREATMENT.other; }
function mmPick(list,id){ return list.find(x=>x.id===id) || list[0]; }

/* input: {species, carat, tier, form, cut, clarity, treatment, origin, cert} -> result or {error} */
function marketModel(inp){
  const sp = MM_SPECIES[inp.species];
  const ct = Number(inp.carat);
  if(!sp) return {error:'No reference price band exists for this gem type in the model.'};
  if(!ct || ct<=0) return {error:'Enter the carat weight.'};
  const tierIdx = Math.max(0, MM_TIERS.findIndex(t=>t.id===inp.tier));
  const base = sp.tiers[tierIdx];
  // size: per-carat price rises with size for rare species; below 1 ct it falls, above 20 ct it flattens
  const sizeCt = Math.min(Math.max(ct, 0.25), 20);
  const sizeMult = Math.pow(sizeCt, sp.exp);
  const form = mmPick(MM_FORMS, inp.form);
  const cut = (form.id==='faceted'||form.id==='cabochon') ? mmPick(MM_CUT, inp.cut) : {label:'n/a (rough)', mult:1};
  const clarityObj = mmPick(MM_CLARITY, inp.clarity);
  const clarityMult = form.id==='specimen' ? 1 : (sp.family==='emerald' ? clarityObj.emerald : (sp.family==='opal' ? Math.max(clarityObj.mult,0.7) : clarityObj.mult));
  const trt = mmPick(mmTreatmentList(inp.species), inp.treatment);
  const org = mmPick(mmOriginList(inp.species), inp.origin);
  const cert = mmPick(MM_CERT, inp.cert);
  // treatment × origin × documentation premiums compound; cap them so extreme combinations stay credible
  const premRaw = trt.mult * org.mult * cert.mult;
  const prem = Math.min(premRaw, 2.5);
  const retailPerCt = base * sizeMult * form.mult * cut.mult * clarityMult * prem;
  const r = (x)=> x>=100 ? Math.round(x/5)*5 : Math.round(x*100)/100;
  const wsLowCt = retailPerCt/MM_MARKUP.low, wsMidCt = retailPerCt/MM_MARKUP.mid, wsHighCt = retailPerCt/MM_MARKUP.high;
  // confidence
  let score = 0;
  if(inp.tier) score += 1;
  if(inp.clarity) score += 0.5;
  if(inp.treatment && inp.treatment!=='unknown') score += 0.5;
  score += cert.conf;
  if(tierIdx===3) score -= 0.5;              // top grades are the hardest to judge from photos
  if(form.id!=='faceted') score -= 0.5;      // rough and cabochon pricing is wider
  const confidence = score>=2 ? 'Medium' : 'Low';
  return {
    species: sp.label, carat: ct, tier: MM_TIERS[tierIdx].id,
    retailPerCt: r(retailPerCt), wsLowCt: r(wsLowCt), wsMidCt: r(wsMidCt), wsHighCt: r(wsHighCt),
    wsLow: Math.round(wsLowCt*ct), wsMid: Math.round(wsMidCt*ct), wsHigh: Math.round(wsHighCt*ct),
    retail: Math.round(retailPerCt*ct), retailLow: Math.round(retailPerCt*ct*0.85), retailHigh: Math.round(retailPerCt*ct*1.2),
    confidence,
    factors: [
      `Reference retail band for ${sp.label}, grade ${MM_TIERS[tierIdx].id} at 1 ct: $${base.toLocaleString()}/ct`,
      `Size ${fmtNum(ct)} ct: ×${sizeMult.toFixed(2)} (per-carat price ${sp.exp>0.2?'rises steeply':'changes little'} with size for this gem)`,
      `Form — ${form.label}: ×${form.mult}`,
      `Cut — ${cut.label}: ×${cut.mult}`,
      `Clarity — ${clarityObj.label}: ×${clarityMult}`,
      `Treatment — ${trt.label}: ×${trt.mult}`,
      `Origin — ${org.label}: ×${org.mult}`,
      `Documentation — ${cert.label}: ×${cert.mult}`,
      ...(premRaw>2.5 ? [`Combined treatment × origin × documentation premium capped at ×2.5 (uncapped ×${premRaw.toFixed(2)})`] : []),
      `Wholesale = retail ÷ ${MM_MARKUP.low} (low), ÷ ${MM_MARKUP.mid} (mid), ÷ ${MM_MARKUP.high} (high) — standard coloured-stone trade markups`,
    ],
  };
}

/* verdict for an asking price vs the model */
function mmVerdict(m, landed){
  if(!landed || !m || m.error) return null;
  if(landed < m.wsLow*0.35) return {tone:'warn', label:'Suspiciously cheap', text:'Far below trade wholesale. Great if genuine — but prices this low often mean a synthetic, an undisclosed treatment, or a misdescribed stone. Only buy with a returns policy or a lab report.'};
  if(landed <= m.wsLow) return {tone:'good', label:'Excellent buy', text:'At or below low wholesale — you are paying less than a dealer typically would.'};
  if(landed <= m.wsMid) return {tone:'good', label:'Good buy', text:'Between low and mid wholesale — a fair trade price with room to hold value.'};
  if(landed <= m.wsHigh) return {tone:'warn', label:'Fair / full wholesale', text:'Upper end of wholesale. Acceptable for a stone you love; little resale margin.'};
  if(landed <= m.retailLow) return {tone:'warn', label:'Expensive', text:'Above wholesale, approaching retail. Negotiate or keep looking unless the stone is exceptional.'};
  return {tone:'bad', label:'Overpriced', text:'At or above the suggested retail price — you would be paying retail for an auction/online purchase.'};
}

/* map a collection item to model inputs (only when the collector has graded it) */
function speciesKeyFor(it){
  const t = ((it.type||'')+' '+(it.variety||'')+' '+(it.color||'')).toLowerCase();
  if(/opal/.test(t)) return /austral|lightning|boulder|black opal/.test(((it.origin||'')+t).toLowerCase()) ? 'opal-australian' : 'opal-ethiopian';
  if(/ruby/.test(t)) return 'ruby';
  if(/sapphire/.test(t)){
    if(/padparad/.test(t)) return 'sapphire-padparadscha';
    if(/white|colou?rless/.test(t)) return 'sapphire-white';
    if(/pink|purple/.test(t)) return 'sapphire-pink';
    if(/yellow|orange|green/.test(t)) return 'sapphire-yellow';
    return 'sapphire-blue';
  }
  if(/emerald/.test(t)) return 'emerald';
  if(/tanzanite/.test(t)) return 'tanzanite';
  if(/spinel/.test(t)) return /red|hot pink/.test(t) ? 'spinel-red' : 'spinel-other';
  if(/topaz/.test(t)) return /mystic|coat|rainbow/.test(t) ? 'topaz-coated' : (/blue|swiss|london/.test(t) ? 'topaz-blue' : 'topaz-imperial');
  if(/amethyst/.test(t)) return 'amethyst';
  if(/citrine/.test(t)) return 'citrine';
  if(/turquoise/.test(t)) return 'turquoise';
  if(/sphene|titanite/.test(t)) return 'sphene';
  if(/sphalerite/.test(t)) return 'sphalerite';
  if(/alexandrite/.test(t)) return 'alexandrite';
  if(/tsavorite/.test(t)) return 'tsavorite';
  if(/garnet|rhodolite|almandine/.test(t)) return 'garnet';
  if(/aquamarine/.test(t)) return 'aquamarine';
  if(/morganite/.test(t)) return 'morganite';
  if(/tourmaline/.test(t)) return 'tourmaline';
  if(/peridot/.test(t)) return 'peridot';
  if(/zircon/.test(t)) return 'zircon';
  return null;
}
function itemModelInput(it){
  const species = it.mmSpecies || speciesKeyFor(it);
  const shape = (it.shape||'').toLowerCase();
  const form = it.mmForm || (/specimen|parcel/.test(shape) ? 'specimen' : /rough|uncut/.test(shape) ? 'rough' : /cabochon|cobochon/.test(shape) ? 'cabochon' : 'faceted');
  const trtText = (it.treatment||'').toLowerCase();
  const fam = species && MM_SPECIES[species] ? MM_SPECIES[species].family : 'other';
  let treatment = it.mmTreatment;
  if(!treatment){
    if(fam==='corundum') treatment = /unheated|natural|untreated|none/.test(trtText) && !/heated$/.test(trtText.replace('unheated','')) ? 'unheated' : (/heat/.test(trtText) ? 'heated' : 'unknown');
    else if(fam==='emerald') treatment = /no oil|untreated|natural/.test(trtText) ? 'none' : (/oil/.test(trtText) ? 'minor' : 'unknown');
    else if(fam==='tanzanite') treatment = /coat/.test(trtText) ? 'coated' : 'heated';
    else if(fam==='opal') treatment = /smok|dye/.test(trtText+(it.variety||'')+(it.color||'')) ? 'smoked' : (/untreated|natural/.test(trtText) ? 'none' : 'unknown');
    else if(fam==='spinel') treatment = /unheated|untreated|natural/.test(trtText) ? 'none' : 'unknown';
    else if(fam==='topaz' || fam==='quartz') treatment = 'standard';
    else treatment = /untreated|natural|none/.test(trtText) ? 'none' : (/coat|fill/.test(trtText) ? 'filled' : (/heat|irrad/.test(trtText)?'treated':'unknown'));
  }
  const o = (it.origin||'').toLowerCase();
  let origin = it.mmOrigin;
  if(!origin){
    if(species==='ruby') origin = /burma|myanmar|mogok/.test(o) ? 'burma' : /thai|cambod/.test(o) ? 'thai' : /mozamb|africa|tanzan|kenya|madagas/.test(o) ? 'std' : 'other';
    else if(fam==='corundum') origin = /kashmir/.test(o) ? 'kashmir' : /burma|myanmar/.test(o) ? 'burma' : /sri lanka|ceylon/.test(o) ? 'ceylon' : /austral|thai/.test(o) ? 'aus' : /madagas|africa|tanzan|mozamb/.test(o) ? 'std' : 'other';
    else if(fam==='emerald') origin = /colomb|columb/.test(o) ? 'colombia' : /zambia/.test(o) ? 'std' : /brazil/.test(o) ? 'brazil' : 'other';
    else if(fam==='spinel') origin = /burma|myanmar|mogok/.test(o) ? 'burma' : /mahenge|tanzan/.test(o) ? 'mahenge' : /sri lanka|vietnam/.test(o) ? 'std' : 'other';
    else origin = 'std';
  }
  const cert = it.mmCert || (it.certStatus==='Certified' ? (/^(gia|grs|ssef|g[uü]belin|agl|lotus)/i.test(it.certIssuer||'') ? 'major' : 'minor') : (it.certStatus==='Auction Verified' ? 'auction' : 'none'));
  const cl = (it.clarity||'').toLowerCase();
  const clarity = it.mmClarity || (/vvs|vs|if|fl|clean|transparent$/.test(cl) ? 'clean' : /si/.test(cl) ? 'slight' : /i1|i2|included/.test(cl) ? 'included' : /translucent|opaque|i3/.test(cl) ? 'heavy' : 'slight');
  return {species, carat: it.caratActual || it.caratReported, tier: it.qualityGrade, form, cut: it.mmCut || 'good', clarity, treatment, origin, cert};
}


/* Valuation dispatcher: a graded item (A–AAAA set by the collector) is valued with the
   market reference model; everything else with the acquisition-anchored heuristic. */
function computeValuation(it){
  let v;
  const inp = it.qualityGrade ? itemModelInput(it) : null;
  const m = inp && inp.species ? marketModel(inp) : null;
  if(m && !m.error){
    v = {level:3, source:'market', confidence:m.confidence, model:m,
      wholesaleLow:m.wsLow, wholesaleMid:m.wsMid, wholesaleHigh:m.wsHigh,
      retailLow:m.retailLow, retailMid:m.retail, retailHigh:m.retailHigh,
      basis:[`Market reference model — you graded this stone ${it.qualityGrade}.`, ...m.factors,
        !isEmpty(it.purchasePriceUSD) ? `For comparison, you paid ${fmtUSD(it.purchasePriceUSD)} (${mmVerdict(m, Number(it.purchasePriceUSD))?.label || '—'} against this model).` : 'No purchase price on file for comparison.',
        'Reference bands compiled from published 2025–26 dealer price guides, adjusted toward trade levels. Not a quote or an appraisal.'],
      missing: it.certStatus==='Certified' ? [] : ['No independent laboratory certificate on file — grade and treatment are taken from the listing.']};
  } else {
    v = acquisitionValuation(it);
    v.source = v.level===3 ? 'acquisition' : 'none';
    v.wholesaleMid = midpoint(v.wholesaleLow, v.wholesaleHigh);
    v.retailMid = midpoint(v.retailLow, v.retailHigh);
    if(v.level===3 && speciesKeyFor(it)) v.missing.push('Grade this stone (A / AA / AAA / AAAA) on its Valuation tab to value it against market reference bands instead of your purchase price.');
  }
  return v;
}

function midpoint(lo,hi){ if(lo===null||hi===null) return null; return Math.round((lo+hi)/2); }

/* ---------- data quality flags ---------- */
function computeFlags(it){
  const flags = [];
  if(isEmpty(it.certNumber) && it.certStatus!=='Certified') flags.push({t:'warn', m:'Missing certificate number'});
  if(isEmpty(it.purchasePriceUSD)) flags.push({t:'bad', m:'Missing purchase price'});
  if(isEmpty(it.caratActual) && isEmpty(it.caratReported)) flags.push({t:'warn', m:'Missing carat weight'});
  if(isEmpty(it.origin)) flags.push({t:'warn', m:'Missing origin'});
  if(isEmpty(it.treatment)) flags.push({t:'warn', m:'Missing treatment information'});
  if(isEmpty(it.purchasePriceUSD)) flags.push({t:'bad', m:'Insufficient data for reliable valuation'});
  else if(isEmpty(it.clarity) && isEmpty(it.color)) flags.push({t:'warn', m:'No colour or clarity grade recorded (lowers valuation confidence)'});
  if((it.conflicts||[]).length) flags.push({t:'bad', m:'Conflicting source information'});
  if(!it.inExcel) flags.push({t:'warn', m:'Not recorded in Gems Log spreadsheet'});
  if(!it.hero && !(it.media||[]).length) flags.push({t:'warn', m:'No image on file'});
  if(flags.filter(f=>f.t==='bad'||f.t==='warn').length===0) flags.push({t:'ok', m:'Complete core record'});
  return flags;
}

async function initCapabilities(){
  try{
    if(window.claude && window.claude.use){
      const [db, assets, sample, user] = await Promise.all(['db','assets','sample','user'].map(n=>window.claude.use(n).catch(()=>null)));
      S.dbNS = db; S.assetsNS = assets; S.sampleNS = sample; S.userNS = user;
    }
  }catch(e){ console.warn('capability init failed', e); }
}

async function loadItems(){
  if(S.dbNS){
    try{
      // db.collection().get() resolves a QuerySnapshot {docs, size, empty}; each doc exposes data()
      let snap = null;
      for(let attempt=0; attempt<2 && !snap; attempt++){
        try{ snap = await S.dbNS.collection('gems').limit(1000).get(); }
        catch(err){ if(attempt===0 && err && err.code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); } else throw err; }
      }
      const docs = (snap && Array.isArray(snap.docs)) ? snap.docs : [];
      S.loadInfo = {docs: docs.length};
      if(docs.length){
        const all = docs.filter(d=>d.exists!==false).map(d=>{
          const body = typeof d.data==='function' ? d.data() : d.data;
          return {...JSON.parse(JSON.stringify(body||{})), _docId:d.id};
        });
        S.items = all.filter(x=>!x.archived);
        S.archived = all.filter(x=>x.archived);
        S.ready = true;
        try{
          const es = await S.dbNS.collection('evaluations').limit(1000).get();
          S.evals = (es && es.docs ? es.docs : []).filter(d=>d.exists!==false).map(d=>JSON.parse(JSON.stringify(typeof d.data==='function'?d.data():d.data)));
        }catch(err){ console.warn('evaluations read failed', err); S.evals = []; }
        return;
      }
    }catch(e){ console.warn('db read failed', e); S.loadError = (e && (e.code||e.message)) || 'unknown'; }
  }
  // fallback: unavailable / empty — show a small clearly-marked example set
  S.ready = false;
  S.items = SAMPLE_FALLBACK;
  S.archived = [];
}

async function saveItem(it){
  it.updatedAt = new Date().toISOString();
  if(S.dbNS && S.ready){
    try{
      const clean = {...it}; delete clean._docId;
      await S.dbNS.collection('gems').doc(it.id).set(clean);
      toast('Saved.');
      return true;
    }catch(e){ toast('Could not save — ' + (e && e.code || 'unknown error')); return false; }
  } else {
    const idx = S.items.findIndex(x=>x.id===it.id);
    if(idx>=0) S.items[idx]=it; else S.items.push(it);
    toast('Saved locally (this preview is not connected to live storage).');
    return true;
  }
}

/* Soft delete: the record is archived (kept in storage, hidden from the libraries, dashboards and
   valuation) so its ID is never reused and it can be restored from Data / Import. */
async function archiveItem(it, reason){
  it.archived = true;
  it.archivedAt = new Date().toISOString();
  it.archiveReason = reason || 'Archived by the collector.';
  const ok = await saveItem(it);
  if(ok){
    S.items = S.items.filter(x=>x.id!==it.id);
    if(!S.archived.some(x=>x.id===it.id)) S.archived.push(it);
  }
  return ok;
}
async function restoreItem(it){
  delete it.archived; delete it.archivedAt; delete it.archiveReason;
  const ok = await saveItem(it);
  if(ok){
    S.archived = S.archived.filter(x=>x.id!==it.id);
    if(!S.items.some(x=>x.id===it.id)) S.items.push(it);
  }
  return ok;
}

function nextId(isOpal){
  const prefix = isOpal ? 'OPL' : 'GEM';
  // IDs are permanent: archived / reclassified / duplicate records still reserve their number
  const nums = [...S.items, ...(S.archived||[])].filter(x=>(x.id||'').startsWith(prefix+'-')).map(x=>{
    const m = /(\d+)$/.exec(x.id||''); return m? parseInt(m[1],10):0;
  });
  const next = (nums.length? Math.max(...nums):0)+1;
  return prefix+'-'+String(next).padStart(5,'0');
}

function certBadge(it){
  const cls = it.certStatus==='Certified' ? 'badge-certified' : it.certStatus==='Auction Verified' ? 'badge-verified' : 'badge-unknown';
  return `<span class="badge ${cls}">${escapeHtml(it.certStatus||'Unknown')}</span>`;
}
function statusBadges(it){
  let h='';
  if(it.sold) h+=`<span class="badge badge-sold">Sold</span> `;
  if(it.gifted) h+=`<span class="badge badge-gifted">Gifted</span> `;
  if(!it.sold && !it.gifted) h+=`<span class="badge badge-active">Active</span>`;
  return h;
}
function heroUrl(it){
  if(it.hero) return it.hero;
  const firstImg = (it.media||[]).find(m=>m.type==='image');
  return firstImg ? firstImg.src : null;
}
function itemImg(it, cls){
  const url = heroUrl(it);
  if(url) return `<img class="${cls}" src="${escapeHtml(url)}" alt="${escapeHtml(it.type)}" loading="lazy">`;
  return `<div class="${cls==='thumb'?'thumb-ph':'img-ph'}">No image on file</div>`;
}

/* ---------- media gallery + lightbox ---------- */
function galleryHtml(it){
  const media = it.media||[];
  if(!media.length) return '';
  const imgs = media.filter(m=>m.type==='image').length, vids = media.filter(m=>m.type==='video').length;
  return `<div class="section-title">Image gallery <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint);font-size:11px;">&middot; ${imgs} image${imgs===1?'':'s'}${vids?` &middot; ${vids} video${vids===1?'':'s'}`:''} from the item's source folder</span></div>
  <div class="gallery">${media.map((m,i)=> m.type==='video'
    ? `<button class="g-item g-video" data-lb="${i}" title="${escapeHtml(m.source||'')}"><span class="g-play">&#9654;</span><span class="g-lbl">Video</span></button>`
    : `<button class="g-item" data-lb="${i}" title="${escapeHtml(m.source||'')}"><img src="${escapeHtml(m.src)}" alt="" loading="lazy"></button>`).join('')}</div>`;
}
function openLightbox(it, idx){
  const media = it.media||[]; if(!media.length) return;
  let i = Math.max(0, Math.min(idx, media.length-1));
  const lb = document.createElement('div'); lb.className='lightbox'; lb.id='lightbox';
  const draw = ()=>{
    const m = media[i];
    lb.innerHTML = `<div class="lb-top"><span class="id-tag" style="color:#ddd">${escapeHtml(it.id)} &middot; ${i+1} / ${media.length}</span><button class="lb-x" data-lbx>&times;</button></div>
      <div class="lb-stage">${m.type==='video'
        ? `<video src="${escapeHtml(m.src)}" controls autoplay loop muted playsinline></video>`
        : `<img src="${escapeHtml(m.src)}" alt="">`}</div>
      <div class="lb-cap">${escapeHtml(m.source||'')}</div>
      ${media.length>1?`<button class="lb-nav lb-prev" data-lbp>&#8249;</button><button class="lb-nav lb-next" data-lbn>&#8250;</button>`:''}`;
    lb.querySelector('[data-lbx]').onclick = close;
    const p = lb.querySelector('[data-lbp]'), n = lb.querySelector('[data-lbn]');
    if(p) p.onclick = (e)=>{ e.stopPropagation(); i=(i-1+media.length)%media.length; draw(); };
    if(n) n.onclick = (e)=>{ e.stopPropagation(); i=(i+1)%media.length; draw(); };
  };
  const key = (e)=>{ if(e.key==='Escape') close(); else if(e.key==='ArrowRight'){ i=(i+1)%media.length; draw(); } else if(e.key==='ArrowLeft'){ i=(i-1+media.length)%media.length; draw(); } };
  const close = ()=>{ lb.remove(); document.removeEventListener('keydown', key); };
  lb.addEventListener('mousedown', e=>{ if(e.target===lb || e.target.classList.contains('lb-stage')) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(lb); draw();
}
function libraryOf(it){ return it.opal ? 'opals' : 'gems'; }
function typeColor(t){
  t=(t||'').toLowerCase();
  if(t.includes('ruby')) return 'var(--ruby)';
  if(t.includes('emerald')) return 'var(--emerald)';
  if(t.includes('sapphire')) return 'var(--sapphire)';
  if(t.includes('opal')) return 'var(--opal-a)';
  if(t.includes('tanzanite')) return 'var(--sapphire)';
  if(t.includes('amethyst')) return 'var(--opal-a)';
  if(t.includes('topaz')) return 'var(--gold)';
  return 'var(--accent)';
}

function activeItems(){ return S.items.filter(x=>!x.sold && !x.gifted); }

window.addEventListener('hashchange', route);
function route(){
  let h = (location.hash||'#dashboard').slice(1);
  closeDrawer();
  if(h.startsWith('item-')){
    renderShell(h.split('-').slice(0,-1)[0]==='item'?'':'');
    openItemDrawer(h.slice(5));
    // keep last list route highlighted
    h = S.route && NAV.some(n=>n.id===S.route) ? S.route : 'gems';
  }
  S.route = NAV.some(n=>n.id===h) ? h : 'dashboard';
  renderShell(S.route);
}

function go(r){ location.hash = '#'+r; }

function renderShell(routeId){
  renderNav(routeId);
  const main = document.getElementById('main');
  if(routeId==='dashboard') main.innerHTML = viewDashboard();
  else if(routeId==='gems') main.innerHTML = viewLibrary(false);
  else if(routeId==='opals') main.innerHTML = viewLibrary(true);
  else if(routeId==='valuation') main.innerHTML = viewValuation();
  else if(routeId==='evaluate') main.innerHTML = viewEvaluate();
  else if(routeId==='screener') main.innerHTML = viewScreener();
  else if(routeId==='sold-gifted') main.innerHTML = viewSoldGifted();
  else if(routeId==='review') main.innerHTML = viewReview();
  else if(routeId==='data') main.innerHTML = viewData();
  if(!S.ready){ main.insertAdjacentHTML('afterbegin', `<div class="conflict-item" style="margin-bottom:16px;font-size:13px;"><strong>Your collection could not be loaded</strong> — the two items below are placeholders, not your stones. ${S.dbNS? 'Storage answered but returned no records' : 'This view has no access to the library\'s storage'}${S.loadError? ' ('+escapeHtml(String(S.loadError))+')':''}. Reload the page; if this persists, open it from claude.ai while signed in.</div>`); }
  wireCommon();

function wireCommon(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick = (e)=>{ e.preventDefault(); go(el.getAttribute('data-go')); document.getElementById('sidebar').classList.remove('open'); };
  });
  document.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = ()=> openAddForm(el.getAttribute('data-add')==='opal');
  });
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.onclick = ()=>{ S.view = el.getAttribute('data-view'); renderShell(S.route); };
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-go]') || e.target.closest('select')) return;
      const id = el.getAttribute('data-open');
      history.replaceState('',document.title,location.pathname+location.search+'#item-'+id);
      openItemDrawer(id);
    };
  });
  document.querySelectorAll('[data-restore]').forEach(el=>{
    el.onclick = async ()=>{ const it=(S.archived||[]).find(x=>x.id===el.getAttribute('data-restore')); if(it && await restoreItem(it)){ toast(it.id+' restored.'); renderShell(S.route);} };
  });
  document.querySelectorAll('[data-grade]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.onchange = async ()=>{
      const it = S.items.find(x=>x.id===el.getAttribute('data-grade')); if(!it) return;
      if(el.value) it.qualityGrade = el.value; else ['qualityGrade','mmSpecies','mmForm','mmCut','mmClarity','mmTreatment','mmOrigin','mmCert'].forEach(k=>delete it[k]);
      await saveItem(it); renderShell(S.route);
    };
  });
  const vf = document.getElementById('valFilter'); if(vf) vf.onchange = ()=>{ S.valFilter = vf.value; renderShell(S.route); };
  const vs = document.getElementById('valSort'); if(vs) vs.onchange = ()=>{ S.valSort = vs.value; renderShell(S.route); };
  const fq = document.getElementById('fq');
  if(fq) fq.oninput = ()=>{ S.filters.q = fq.value; renderShell(S.route); const el=document.getElementById('fq'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } };
  const fstatus = document.getElementById('fstatus');
  if(fstatus) fstatus.onchange = ()=>{ S.filters.status = fstatus.value; renderShell(S.route); };
  const fcert = document.getElementById('fcert');
  if(fcert) fcert.onchange = ()=>{ S.filters.cert = fcert.value; renderShell(S.route); };
  const forigin = document.getElementById('forigin');
  if(forigin) forigin.onchange = ()=>{ S.filters.origin = forigin.value; renderShell(S.route); };
  const fsort = document.getElementById('fsort');
  if(fsort) fsort.onchange = ()=>{ S.filters.sort = fsort.value; renderShell(S.route); };
}

function filteredItems(isOpal){
  let rows = S.items.filter(x=>!!x.opal===isOpal);
  const f = S.filters;
  if(f.status==='active') rows = rows.filter(x=>!x.sold&&!x.gifted);
  else if(f.status==='sold') rows = rows.filter(x=>x.sold);
  else if(f.status==='gifted') rows = rows.filter(x=>x.gifted);
  if(f.cert!=='all') rows = rows.filter(x=>x.certStatus===f.cert);
  if(f.origin!=='all') rows = rows.filter(x=>(x.origin||'').includes(f.origin));
  if(f.treatment!=='all') rows = rows.filter(x=>(x.treatment||'').toLowerCase().includes(f.treatment.toLowerCase()));
  if(f.q){
    const q=f.q.toLowerCase();
    rows = rows.filter(x=> [x.id,x.type,x.variety,x.origin,x.color,x.certNumber,x.certIssuer,x.vendorExcel,x.vendorPP,x.invoiceNumber,x.comments,x.treatment,x.ppTitle].some(v=>v!==undefined&&v!==null&&String(v).toLowerCase().includes(q)));
  }
  const [key,dir] = f.sort.split('-');
  rows = rows.slice().sort((a,b)=>{
    let av,bv;
    if(key==='id'){ av=a.id; bv=b.id; }
    else if(key==='carat'){ av=Number(a.caratActual||a.caratReported||0); bv=Number(b.caratActual||b.caratReported||0); }
    else if(key==='price'){ av=Number(a.purchasePriceUSD||-1); bv=Number(b.purchasePriceUSD||-1); }
    else if(key==='wholesale'){ av=computeValuation(a).wholesaleMid||-1; bv=computeValuation(b).wholesaleMid||-1; }
    else if(key==='date'){ av=a.purchaseDate||''; bv=b.purchaseDate||''; }
    else if(key==='type'){ av=a.type||''; bv=b.type||''; }
    else { av=a.id; bv=b.id; }
    if(av<bv) return dir==='asc'?-1:1;
    if(av>bv) return dir==='asc'?1:-1;
    return 0;
  });
  return rows;
}

/* =========================================================================

function viewValuation(){
  const active = activeItems();
  const all = active.map(it=>({it, v:computeValuation(it)}));
  const valued = all.filter(x=>x.v.level===3);
  const notValued = all.filter(x=>x.v.level!==3);
  const f = S.valFilter || 'all';
  const sortKey = S.valSort || 'wholesale';
  const sum = (rows,k)=>rows.reduce((s,x)=>s+(Number(k==='cost'?x.it.purchasePriceUSD:x.v[k])||0),0);
  const split = (rows)=>({n:rows.length, cost:sum(rows,'cost'), wl:sum(rows,'wholesaleLow'), wm:sum(rows,'wholesaleMid'), wh:sum(rows,'wholesaleHigh'), rm:sum(rows,'retailMid')});
  const T = split(valued), G = split(valued.filter(x=>!x.it.opal)), O = split(valued.filter(x=>x.it.opal));
  const nMarket = valued.filter(x=>x.v.source==='market').length;
  const byType = {};
  valued.forEach(({it,v})=>{ const t=it.opal?'Opal':(it.type||'Unknown'); byType[t]=byType[t]||{cost:0,wholesale:0,retail:0,count:0};
    byType[t].cost+=Number(it.purchasePriceUSD||0); byType[t].wholesale+=v.wholesaleMid; byType[t].retail+=v.retailMid; byType[t].count++; });
  const maxV = Math.max(1,...Object.values(byType).map(x=>x.retail));
  let rows = valued.filter(x=> f==='all' || (f==='gems' ? !x.it.opal : x.it.opal));
  const sorters = {wholesale:(a,b)=>b.v.wholesaleMid-a.v.wholesaleMid, cost:(a,b)=>(b.it.purchasePriceUSD||0)-(a.it.purchasePriceUSD||0),

      <strong>Purchase price basis</strong> (ungraded stones): your documented purchase price × a multiplier for certification, treatment and size, plus the same retail markup.
      Neither is an appraisal or a sourced quote; for insurance of the higher-value stones, use an independent appraisal.

   ========================================================================= */
const EV_DEFAULT = {species:'sapphire-blue', carat:'', tier:'AA', form:'faceted', cut:'good', clarity:'clean', treatment:'heated', origin:'std', cert:'auction', ask:'', premium:'', fees:'', title:'', link:'', notes:''};
function evState(){ if(!S.ev) S.ev = {...EV_DEFAULT}; return S.ev; }
function evLanded(e){
  const ask = Number(e.ask)||0; if(!ask) return 0;
  return Math.round(ask*(1+(Number(e.premium)||0)/100) + (Number(e.fees)||0));
}
function evCautions(key, e, m){
  const c = [];
  const fam = MM_SPECIES[key]?.family;
  if(fam==='corundum' && e.treatment==='unheated') c.push('"Unheated" roughly doubles the price — only pay for it with a lab report (GIA, GRS, SSEF, Gübelin, AGL, Lotus) that states no indications of heating.');
  if(fam==='corundum') c.push('Ask directly whether the stone is glass/lead-glass filled or diffusion treated; these trade at a small fraction of heated stones.');
  if(fam==='emerald') c.push('Ask for the degree of clarity enhancement (none / minor / moderate / significant). "No oil" claims need a lab report; resin-filled stones are worth far less.');
  if(fam==='tanzanite') c.push('Check for coating (unusual iridescence, scratches on facet edges); almost all tanzanite is heated, which is normal.');
  if(fam==='opal') c.push('Ethiopian Welo opal is hydrophane: it can absorb water and temporarily lose play-of-colour. Ask whether it is smoked or dyed — "smoked" opal is a treatment.');
  if(fam==='topaz') c.push('Blue topaz is irradiated as standard and "mystic" topaz is coated — both are inexpensive per carat; judge on size and cut, not rarity.');
  if(e.cert==='none' && m && m.wsMid>500) c.push('Over ~$500 at wholesale, an independent lab report is worth more than it costs — ask for one or budget for it.');
  if(Number(e.carat)>0 && m && m.retailPerCt && key && ['ruby','sapphire-blue','emerald','alexandrite'].includes(key) && evLanded(e) && evLanded(e) < m.wsLow*0.35) c.push('The price is far below trade levels for this description — the most common explanations are a synthetic, heavy treatment, or an over-graded listing.');
  c.push('Compare the listing photos and video with the grade you entered: auction listings often over-grade colour (e.g. "AAA" that is really AA).');
  return c;
}

      </tr>`;}).join('')}</tbody></table></div>` : '<div class="empty-state" style="padding:24px;">No saved evaluations yet — fill in a stone above and press “Save evaluation”.</div>'}
  </div>`;
}
function renderEvResult(){
  const box = document.getElementById('evResult'); if(!box) return;
  const e = evState();
  const m = marketModel(e);
  if(m.error){ box.innerHTML = `<div class="panel"><div class="empty-state" style="padding:40px 10px;">${escapeHtml(m.error)}</div></div>`; return; }
  const landed = evLanded(e);
  const vd = mmVerdict(m, landed);
  const scaleMax = Math.max(m.retailHigh, landed||0)*1.05;
  const pos = x => Math.min(100, Math.max(0, x/scaleMax*100)).toFixed(1);
